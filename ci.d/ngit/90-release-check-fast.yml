  release-check-fast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Fast release-check on main (conformance + repro skipped)
        run: make release-check-fast VERSION="$(cat VERSION)"
