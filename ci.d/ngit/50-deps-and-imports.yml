  deps-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Dependency sync check
        run: python3 tests/contract/check-deps-sync.py
      - name: Gonuts pin identity (one version, every carrier)
        run: |
          # Offline leg only (the ngit lane has no GitHub token for the
          # fork-tag query; --latest is scripts/release-check.sh's verdict).
          bash tests/contract/gonuts-pin_test.sh
          python3 tests/contract/check-gonuts-pin.py
      - name: Mirror and relay sync check
        run: python3 tests/contract/check-mirror-sync.py
      - name: Stale import path check
        run: python3 tests/contract/check-import-paths.py
      - name: CI fragments drift check (assemble → diff)
        run: |
          # The Test workflow twins are rendered from ci.d/ by ONE generator
          # (#920). --check re-renders and diffs the committed copies, so a
          # hand-edit to a rendered workflow — or a fragment changed without
          # re-rendering — fails here, not at merge time; the verdicts
          # harness plants each drift shape and requires the refusal.
          python3 scripts/assemble-ci.py --check
          bash tests/contract/ci-fragments_test.sh
