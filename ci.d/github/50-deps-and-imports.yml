  deps-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Dependency sync check
        run: python3 tests/contract/check-deps-sync.py
      - name: Gonuts pin identity (one version, every carrier)
        run: |
          # Offline leg only: every go.mod that references the wallet fork
          # must pin the manifest's version exactly (#791). The --latest
          # staleness leg (pin must be the fork's newest stable tag) is a
          # release-time verdict — scripts/release-check.sh — because
          # failing every open PR the moment the fork tags would be noise.
          bash tests/contract/gonuts-pin_test.sh
          python3 tests/contract/check-gonuts-pin.py
      - name: Toolchain parity (manifest is the single source of truth)
        run: python3 tests/contract/check-toolchain-parity.py

      - name: Build-surface doctrine (two paths, no third)
        run: python3 tests/contract/check-build-surface.py
      - name: Stale import path check
        run: python3 tests/contract/check-import-paths.py
      - name: Changelog duplicate entries check
        run: python3 tests/contract/check-changelog-duplicates.py
      - name: Changelog duplicates check verdicts
        run: bash tests/contract/changelog-duplicates_test.sh
      - name: CI fragments drift check (assemble → diff)
        run: |
          # The Test workflow twins are rendered from ci.d/ by ONE generator
          # (#920). --check re-renders and diffs the committed copies, so a
          # hand-edit to a rendered workflow — or a fragment changed without
          # re-rendering — fails here, not at merge time; the verdicts
          # harness plants each drift shape and requires the refusal.
          python3 scripts/assemble-ci.py --check
          bash tests/contract/ci-fragments_test.sh
