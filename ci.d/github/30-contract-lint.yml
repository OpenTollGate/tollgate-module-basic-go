  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Changelog fragments: a change's entry is its own file under changelog.d/
      # instead of a hunk in CHANGELOG.md, so two pull requests can never edit the
      # same lines (docs/architecture/changelog-fragments-decision.md). This
      # validates the fragments and the tool that folds them into the release
      # section, and runs the tool's contract test.
      - name: Changelog fragments (names, bodies, fold tool)
        run: |
          python3 scripts/changelog-assemble.py check
          bash tests/contract/changelog-fragments_test.sh

      - name: Fences dispatcher verdicts (fences.d/ + hooks/pre-commit)
        run: |
          # hooks/pre-commit dispatches fences.d/*.sh (#920): one file per
          # fence, lexical order, each a complete if/fi block parsed
          # standalone. The verdicts plant the shape that broke main — a
          # merge ate an entire `fi`, and every hook-driven commit was
          # refused since — and require the refusal.
          bash tests/contract/fences-dispatch_test.sh

      - name: Agent-docs partition fence (AGENTS.md <-> docs/agents/)
        run: |
          # AGENTS.md is a stable core; growing doctrine lives in
          # docs/agents/<topic>.md behind a fenced index (#920). Every
          # topic file must be indexed, every listing must resolve, every
          # entry must carry its load directive — planted drift shapes are
          # refused by name.
          bash tests/contract/agents-partition_test.sh

      - name: Schema lint
        run: node tests/contract/js-schema-lint.mjs

      - name: Portal bundle contract (pin decode + admin-redirect coverage)
        run: |
          # The shipped captive portal is built from .portal.commit, so this
          # step gates the PIN, not the tree:
          #
          #   check A  a pinned revision that validates tokens with a
          #            keyset-requiring decode (getDecodedToken without a
          #            MintKeyset list) rejects every v4 cashuB token carrying a
          #            short keyset id - i.e. coinos/minibits - which the portal
          #            reports as #CU102.
          #   checks C/D/E  the MAC on the Lightning calls, the LN003/LN004
          #            strings, the swap-fee gate's keyset objects, the in-page
          #            renewal and the note's mint.
          #   check F  the pinned portal's 92-tollgate-admin-setup (installed as
          #            999-tollgate-admin-setup, and run LAST so the credential
          #            exists first) is NOT in this repository (the module ships
          #            90 and 99; the portal's 92
          #            is staged from the pin into the package), so it is resolved
          #            FROM THE PIN and must derive uhttpd.admin.redirect_https
          #            from the module CLI's own coverage predicate
          #            (`tollgate ssl covers`), write an explicit value in BOTH
          #            directions, and not decide the hop from a fixed-path test
          #            on the image's placeholder pair (/etc/uhttpd.crt,
          #            CN=OpenWrt) - which satisfies every existence check while
          #            covering neither the router's hostname nor its LAN IP, and
          #            redirected :8090 into a hard certificate error.
          #
          # Check F fails rather than skips when the pin is unreadable, in every
          # environment; checks A-E are strict in CI and skip offline.
          bash tests/packaging/assert-portal-bundle-contract.sh

      - name: Packaging recipe dependency contract
        run: |
          # Offline (no SDK, no router, no network): every in-tree packaging
          # recipe - packaging/Makefile, packaging/local-build-ipk.sh,
          # .github/workflows/build-package.yml's own DEPENDS line and the
          # generated .ngit/act/workflows shards - must declare the daemon the
          # module gates the network with and must not claim to replace it.
          # This test has existed since the nodogsplash dependency incident but
          # was never wired into CI, so nothing ran it automatically.
          bash tests/packaging/package-nodogsplash-dependency_test.sh

      - name: GPL license ships in both release lanes
        run: |
          # Offline (no SDK, no router, no network): issue #751 — the SDK
          # .apk lane was metadata-only while the .ipk lanes installed the
          # GPL-3.0 text, so the same version shipped different contents per
          # format. Every staging surface (packaging/Makefile, local-build-ipk,
          # the CI ipk lane) now ships the text at the same payload path, the
          # SDK recipe REQUIRES the file (a GPL build without its license
          # fails, not silently ships), and the built-artifact harness
          # hard-fails any package missing it.
          bash tests/packaging/license-both-lanes_test.sh

      - name: Setup-marker ordering (roll-back safety)
        run: |
          # Offline (no router, no SDK, no network): the setup script's version
          # marker must be compared BY ORDER, not for equality. Equality made a
          # downgrade look like an upgrade, so rolling back re-ran full setup
          # and re-randomised the operator's guest SSID (bench MT3000,
          # 2026-09-24). The suite pins absent/same/older/newer/malformed/
          # suffixed markers and the alpha4->alpha5->alpha4 round trip, and its
          # negative control fails if the comparison ever goes back to equality.
          bash tests/uci-defaults-setup-marker-order_test.sh

      - name: Exactly one owner of :8090, and LuCI alone on :8080
        run: |
          # Offline (no router, no SDK, no network): the portal-staged board
          # (uhttpd.admin, written by the feed's 92-tollgate-admin-setup) is the
          # ONE section that may claim :8090, and the module writes no :8090
          # listener of its own. It used to: a brand-gated legacy configUI
          # writer created a second section on the port, so two admin UIs bound
          # the same port and one of them disappeared. The suite drives the
          # shipped uci-defaults script end to end through the four install
          # scenarios - fresh, upgrade, reinstall-over-marker, and a box whose
          # legacy section had its listeners stripped by an older build (which
          # is why the stale section must be DELETED, not port-stripped) - and
          # carries detector controls so a passing assertion cannot be vacuous.
          bash tests/packaging/configui-8090-single-owner_test.sh

      - name: No re-brand literal anywhere in the tree
        run: |
          # Offline and tree-only: upstream carries no commercial re-brand's
          # name - not in the setup script, not in the docs, not in the
          # CHANGELOG. The gutter fails the moment a literal reappears, and
          # scans itself: the pattern is a bracket expression, so this file does
          # not carry the name it bans. A planted-occurrence control proves the
          # scan is not inert. This is a working-tree gutter, not a history
          # rewrite: the literal legitimately survives in old commits.
          bash tests/packaging/rebrand-literal-gutter_test.sh

      - name: Admin TLS identity (HTTPS is not inherited from the image)
        run: |
          # Offline (no router, no SDK, no network): the install path must
          # PROVISION a TLS identity that covers this router and must derive
          # uhttpd.main.redirect_https from a COVERAGE check, not from a
          # readable-and-non-empty certificate file. The OpenWrt image ships a
          # placeholder (CN=OpenWrt, SAN DNS:OpenWrt) that satisfies the old
          # guard while covering neither the hostname nor the LAN IP, so :8080
          # redirected a browser into a hard certificate error (bench MT3000,
          # 2026-09-26). The suite drives the shipped uci-defaults script end to
          # end against a fixture, pins the operator opt-out that `tollgate ssl
          # remove` records, and carries a negative control that runs the
          # pre-change rule over the same fixture and must derive
          # redirect_https=1 from the placeholder.
          bash tests/uci-defaults-admin-tls-identity_test.sh
      - name: LuCI is not reachable pre-auth (guest path is the portal)
        run: |
          # Offline (no router, no daemon, no network): LuCI's :8080/:443 must
          # not be in nodogsplash's pre-auth allow list, and a list that carries
          # them must be repaired on every setup path. Measured on the bench
          # MT3000 (2026-09-25, pre17): a paying guest who typed
          # `http://<router>/` fell through to `https://<router>/` and got the
          # router's administration login, which the operator read as
          # "the install is broken".
          bash tests/uci-defaults-luci-ports-not-pre-auth_test.sh

      - name: A trusted client gets a plain-HTTP entry point on :80
        run: |
          # Offline (no router, no daemon, no network): nodogsplash DNATs :80 to
          # its splash port only for a PRE-AUTH client, so for a trusted or
          # authenticated one `http://<router>/` was dead (nothing listened) and
          # the client fell through to LuCI. The suite pins the uhttpd.trusted
          # :80 listener, its redirect stub to the portal SPA on :2051, and that
          # both setup paths re-assert it.
          bash tests/uci-defaults-trusted-entry-80_test.sh

      - name: Pre-auth DNS is allowed on UDP, not only TCP
        run: |
          # Offline (no router, no daemon, no network): issue #749 - the
          # pre-auth allow list carried only tcp/53 (the feed default), so the
          # UDP query every stub resolver sends first was dropped by ndsRTR and
          # hostname resolution from a captive client timed out (the portal is
          # usually reached by name). The suite pins both 'allow tcp port 53'
          # and 'allow udp port 53' with protocol-aware guards: a port-only
          # guard would see the feed's tcp/53 entry and skip the udp add.
          bash tests/uci-defaults-dns-preauth_test.sh

      - name: The wired LAN ports move onto the operator's private bridge
        run: |
          # Offline (no router, no daemon, no network): the wired LAN ports
          # must be MOVED off the captive bridge onto br-private - the
          # operator's trusted network with internet, the admin board and
          # LuCI, no payment step - discovered from the bridge's device
          # section (never named per board), idempotently, with the captive
          # bridge's port list cleared so a port is never on two layer-2
          # domains. The same-version verify/repair path re-asserts the
          # placement (a factory reset is repaired), the module keep-list
          # still carries /etc/config/network, and the guard fragments are
          # pinned by digest (three byte-identical to main; the :2121
          # backend-firewall guard updated on purpose so the owner network can
          # read the admin board's data) and still br-lan-scoped - that literal
          # is what keeps a guest off :8090/:8443 and LuCI while a br-private
          # client gets in. A neutralised-writer negative control must go red.
          bash tests/uci-defaults-lan-private-wired_test.sh

      - name: The backend API answers the owner network (admin board data path)
        run: |
          # Offline (no router, no daemon, no network): the :2121 API must be
          # reachable from br-private as well as br-lan. The admin board is
          # deliberately kept OFF the captive bridge, so br-private is the one
          # network it is administered from - and the board is a thin shell
          # whose every panel reads pricing/whoami/balance/ln-invoice from
          # :2121. With the exemption missing, the board rendered on a freshly
          # flashed GL-MT3000 (2026-10-04, alpha4-pre21) while each data call
          # died with "TypeError: NetworkError when attempting to fetch
          # resource" and retried forever. The suite pins the exemption set on
          # both protocol families, that the rule is still a drop, that no
          # foreign interface is exempted, and that the fragment compiles.
          bash tests/packaging/backend-api-owner-network_test.sh

      - name: One device code (hostname, captive SSID and private SSID agree)
        run: |
          # Offline (no router, no SDK, no network): the router's identity is
          # ONE code, minted once, stored in /etc/config/tollgate and reused —
          # never re-minted. Measured on the bench MT3000 (2026-09-26):
          # hostname=tollgate-OQ3Q while the captive SSID had been re-minted to
          # tollgate-0GLK by a later deploy and the private SSID carried a
          # suffix from a third mint path, because nothing was ever stored. The
          # suite pins the adoption order (store, machine-shaped hostname,
          # machine-shaped SSID, mint), the store's authority over every other
          # source, that an already-deployed router adopts the code it is
          # already known by instead of minting a third one, the <nym>-<code>
          # private SSID with `tollgate network private rename` as the honoured
          # escape hatch, and that the shipped script has exactly ONE mint site.
          # The same case table is pinned on the installer side
          # (OpenTollGate/tollgate-installer, branding_test.go), with two
          # documented exceptions in docs/architecture/one-device-code.md: the
          # nym charset and the installer's suffix-less nodogsplash banner.
          bash tests/uci-defaults-device-code_test.sh

      - name: The portal banner is one value on both paths, and committed
        run: |
          # Offline (no router, no daemon, no network): nodogsplash's
          # `gatewayname` is the string a captive client reads on the splash
          # page, and TWO writers in the shipped driver produce it — the full
          # setup and the verify/repair convergence a same-version reinstall
          # takes. The repair path used to converge on a second spelling (no
          # " Portal" suffix) and never committed it on a settled router: its
          # block runs BEFORE the nodogsplash export-diff snapshot the
          # conditional commit is taken against, so the write stayed a
          # /tmp/.uci session delta, the config file kept the old banner, and
          # any later `uci commit nodogsplash` re-applied the stale delta on top
          # of the file (PR #605 cold review, findings F1/F2). This suite drives
          # BOTH paths end to end against a DELTA-AWARE uci (a committed state
          # file plus a pending-delta file, as real uci has under /tmp/.uci) and
          # pins one committed banner value from each path with no gatewayname
          # op left pending. The other suites cannot see it: their flat-file uci
          # returns empty for `export`, so their harness commits unconditionally.
          bash tests/uci-defaults-gatewayname-banner_test.sh


      - name: Spec-quote drift check
        run: |
          # Pinned greatspectations ref (scheduled bump: update when releasing).
          GS_REF=0f226495657e5febebd270b6a07b8562cca003d3
          # Pinned cashubtc/nuts snapshot (scheduled bump: update when releasing).
          NUTS_REF=49a909ce4d0739824b3859d4b3da21e6c1abdaeb
          pip install --user --break-system-packages "git+https://github.com/rustyrussell/greatspectations.git@$GS_REF"
          export PATH="$PATH:$HOME/.local/bin"
          git init -q nuts
          git -C nuts remote add origin https://github.com/cashubtc/nuts.git
          git -C nuts fetch --depth=1 origin "$NUTS_REF"
          git -C nuts checkout --detach FETCH_HEAD
          FILES=$(find src -name "*.go" -not -name "*_test.go")
          # Spec drift FAILS the build: quotes verified against pinned nuts snapshot.
          greatspectate check --config specquotes.toml --comment-start "// " --comment-continue "//" $FILES
