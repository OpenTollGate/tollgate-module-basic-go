name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 6 * * *"

jobs:
  gitleaks:
    # Org-wide reusable scanner, single definition in OpenTollGate/.github
    # (migrated from Amperstrand/.github — tollgate-module-basic-go#758).
    # Rules + allowlists live in THIS repo's .gitleaks.toml, shared with
    # the ngit lane so both build paths scan the same config.
    uses: OpenTollGate/.github/.github/workflows/gitleaks.yml@main
