name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      full_compression:
        description: "Build all UPX compression variants (overrides the branch gate)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: "tollgate-wrt"
  # The Go toolchain version is NOT set here: the compile-binaries job
  # resolves it from packaging/build-inputs.json (.go.version) so the
  # workflow and the manifest cannot drift apart (#448).
  DEBUG: "true"
  BLOSSOM_SERVERS: "https://blossom.primal.net https://blossom.psbt.me https://blossom1.orangesync.tech https://blossom2.orangesync.tech https://drive.cashu.email"
  # Tag publishes must land on enough mirrors that the redundancy the channel
  # promises is real; branch/dev builds stay lenient (1) so flaky mirrors
  # don't block iteration.
  BLOSSOM_MIN_SUCCESS: ${{ startsWith(github.ref, 'refs/tags/') && '3' || '1' }}
  COORDINATION_RELAYS: >-
    wss://relay.damus.io
    wss://nos.lol
    wss://nostr.mom
    wss://relay1.orangesync.tech
    wss://relay2.orangesync.tech

jobs:
  define-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      ipk_matrix: ${{ steps.set-matrix.outputs.ipk_matrix }}
      apk_matrix: ${{ steps.set-matrix.outputs.apk_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: set-matrix
        run: |
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          cat > matrix.json << 'EOF'
          {
            "include": [
              { "architecture": "aarch64_cortex-a53", "compile_key": "arm64",            "sdk": "mediatek-filogic", "ipk": true, "apk": true },
              { "architecture": "aarch64_cortex-a53", "compile_key": "arm64",            "sdk": "mediatek-filogic", "ipk": true, "apk": true,  "compression": "upx-ultra-brute" },
              { "architecture": "mipsel_24kc",        "compile_key": "mipsle-softfloat", "sdk": "ramips-mt7621",    "ipk": true, "apk": false },
              { "architecture": "mipsel_24kc",        "compile_key": "mipsle-softfloat", "sdk": "ramips-mt7621",    "ipk": true, "apk": false, "compression": "upx-ultra-brute" },
              { "architecture": "mips_24kc",          "compile_key": "mips-softfloat",   "sdk": "ath79-generic",    "ipk": true, "apk": false },
              { "architecture": "mips_24kc",          "compile_key": "mips-softfloat",   "sdk": "ath79-generic",    "ipk": true, "apk": false, "compression": "upx-fast" },
              { "architecture": "mips_24kc",          "compile_key": "mips-softfloat",   "sdk": "ath79-generic",    "ipk": true, "apk": false, "compression": "upx-best" },
              { "architecture": "mips_24kc",          "compile_key": "mips-softfloat",   "sdk": "ath79-generic",    "ipk": true, "apk": false, "compression": "upx-brute" },
              { "architecture": "mips_24kc",          "compile_key": "mips-softfloat",   "sdk": "ath79-generic",    "ipk": true, "apk": false, "compression": "upx-ultra-brute" }
            ]
          }
          EOF

          # SDK digests come from packaging/build-inputs.json — the single
          # source of truth — so this matrix cannot drift from the manifest:
          # every row's digest is injected here, never hand-copied.
          jq --slurpfile inputs packaging/build-inputs.json -c '
            .include |= map(
              .sdk as $sdk
              | ($inputs[0].openwrt_sdk.targets[$sdk].digest //
                 (error("no SDK digest pinned for target \($sdk) in packaging/build-inputs.json")))
              as $digest
              | . + {digest: $digest}
            )
          ' matrix.json > matrix.digests.json
          mv matrix.digests.json matrix.json

          if [[ "${{ github.event.inputs.full_compression }}" == "true" ]]; then
            echo "full_compression=true — keeping all variants."
          elif [[ "$GITHUB_REF" != "refs/heads/main" \
               && "$GITHUB_REF" != refs/tags/v* \
               && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Non-release ref ($GITHUB_REF, event=$GITHUB_EVENT_NAME) — dropping compression variants."
            jq -c '{include: [.include[] | select(has("compression") | not)]}' matrix.json > matrix.filtered.json
            mv matrix.filtered.json matrix.json
          fi

          echo "matrix=$(jq -c '{include: [
            (.include[] | select(.ipk) | del(.ipk, .apk) + {format: "ipk"}),
            (.include[] | select(.apk) | del(.ipk, .apk) + {format: "apk"})
          ]}' matrix.json)" >> $GITHUB_OUTPUT
          echo "ipk_matrix=$(jq -c '{include: [.include[] | select(.ipk) | del(.ipk, .apk) + {format: "ipk"}]}' matrix.json)" >> $GITHUB_OUTPUT
          echo "apk_matrix=$(jq -c '{include: [.include[] | select(.apk) | del(.ipk, .apk) + {format: "apk"}]}' matrix.json)" >> $GITHUB_OUTPUT

  determine-versioning:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.determine-package-version.outputs.package_version }}
      release_channel: ${{ steps.determine-release-channel.outputs.release_channel }}
      build_id: ${{ steps.build-id.outputs.build_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the tag matches VERSION
        # VERSION at the repository root is the single source of truth for the
        # release version (see docs/release-process.md). Refusing a tag that disagrees with it
        # is what stops a release from being published under a version nobody
        # wrote down — and stops the fork-only tag traps that produced the
        # orphaned v0.7.0-alpha* tags.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          file_version=$(tr -d '[:space:]' < VERSION)
          if [ "$file_version" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match VERSION (${file_version})." >&2
            echo "Bump VERSION in the release commit and tag that commit." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches VERSION."

      - id: commit-hash
        shell: bash
        run: |
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - id: build-id
        shell: bash
        run: |
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          echo "build_id=${{ steps.commit-hash.outputs.short }}-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set package_version variable
        id: determine-package-version
        shell: bash
        run: |
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "package_version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            SANITIZED_BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | sed 's/\//-/g')
            COMMIT_HEIGHT=$(git rev-list --count HEAD)
            echo "package_version=${SANITIZED_BRANCH_NAME}.${COMMIT_HEIGHT}.${{ steps.commit-hash.outputs.short }}" >> $GITHUB_OUTPUT
          fi

      - name: Set release channel
        id: determine-release-channel
        shell: bash
        run: |
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            if   [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha ]]; then echo "release_channel=alpha"  >> $GITHUB_OUTPUT
            elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta  ]]; then echo "release_channel=beta"   >> $GITHUB_OUTPUT
            elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$      ]]; then echo "release_channel=stable" >> $GITHUB_OUTPUT
            else                                                          echo "release_channel=dev"    >> $GITHUB_OUTPUT
            fi
          else
            echo "release_channel=dev" >> $GITHUB_OUTPUT
          fi

  compile-binaries:
    timeout-minutes: 30
    needs: [determine-versioning]
    # The publish pipeline (Blossom upload + Nostr publish) needs the NSEC_HEX
    # secret, which GitHub withholds from fork PRs. Skip the whole pipeline for
    # fork PRs so they don't go red on an empty NSEC_HEX; same-repo PRs and
    # pushes run as normal. Downstream jobs (package-ipk/apk, publish-metadata,
    # trigger-build-os) inherit this via `needs:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.blossom-upload.outputs.hashes }}
      epoch: ${{ steps.epoch.outputs.epoch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Reproducible binaries need the exact patch pinned in
      # packaging/build-inputs.json (.go.version) — resolved here so the
      # workflow and the manifest cannot drift apart (#448).
      - name: Resolve the pinned Go from the manifest
        id: go_pin
        run: |
          set -euo pipefail
          echo "version=$(jq -r '.go.version' packaging/build-inputs.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_pin.outputs.version }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Derive SOURCE_DATE_EPOCH from source commit
        id: epoch
        run: |
          set -euo pipefail
          # One canonical epoch for this job; exported as an output so
          # downstream package jobs use the identical value.
          EPOCH=$(git log -1 --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"

      - name: Cross-compile all binaries
        env:
          CGO_ENABLED: "0"
          PACKAGE_VERSION: ${{ needs.determine-versioning.outputs.package_version }}
        run: |
          set -euo pipefail
          # ONE flag recipe for every lane. packaging/build-env.sh owns the
          # ldflags (Version, GitCommit, BuildTime, GitBranch), the epoch and
          # the locale, and it is the same helper scripts/repro-test.sh calls —
          # so the release binaries and the ones the reproducibility harness
          # compares are built from identical flags. Hand-rolling them here is
          # what let the two drift: this step injected no GitBranch at all
          # (repro-test built with main) and stamped the branch-derived
          # package_version where the harness stamps VERSION.
          #
          # The binaries embed the version in VERSION at the repository root,
          # the single source of truth (scripts/check-version-sync.sh enforces
          # it, and the tag check above pins refs/tags/* to it), so a release
          # build and a harness build of one commit embed the same string.
          # PACKAGE_VERSION — the tag, or <branch>.<height>.<sha> for branch
          # builds — still versions the packages, their control metadata and
          # the Nostr announcement; only the ldflags take VERSION.
          BUILD_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$BUILD_VERSION" ]; then
            echo "ERROR: VERSION at the repository root is empty." >&2
            exit 1
          fi
          # TG_ROOT matters: build-env.sh cannot infer the repository from $0
          # when it is sourced from a workflow step script.
          TG_ROOT="$GITHUB_WORKSPACE"
          export TG_ROOT BUILD_VERSION
          # shellcheck source=packaging/build-env.sh
          . "$GITHUB_WORKSPACE/packaging/build-env.sh"

          LDFLAGS="$(go_ldflags "$BUILD_VERSION")"

          # The tollgate CLI is a separate Go module that does not link the
          # src/cli package, so its version must be injected via main.version.
          CLI_LDFLAGS="$(cli_ldflags "$BUILD_VERSION")"
          echo "BUILD_VERSION=$BUILD_VERSION"
          echo "LDFLAGS: $LDFLAGS"
          echo "CLI_LDFLAGS: $CLI_LDFLAGS"

          TARGETS='[
            {"key":"arm64","goarch":"arm64"},
            {"key":"armv7","goarch":"arm","goarm":"7"},
            {"key":"mipsle-softfloat","goarch":"mipsle","gomips":"softfloat"},
            {"key":"mips-softfloat","goarch":"mips","gomips":"softfloat"},
            {"key":"amd64","goarch":"amd64"}
          ]'

          while IFS= read -r t; do
            key=$(printf '%s' "$t" | jq -r '.key')
            goarch=$(printf '%s' "$t" | jq -r '.goarch')
            goarm=$(printf '%s' "$t" | jq -r '.goarm // empty')
            gomips=$(printf '%s' "$t" | jq -r '.gomips // empty')

            echo "=== Building key=$key GOARCH=$goarch GOARM=$goarm GOMIPS=$gomips ==="
            mkdir -p "bin/$key"

            GOOS=linux GOARCH=$goarch GOARM=${goarm:-} GOMIPS=${gomips:-} \
              go build -C src -o "$GITHUB_WORKSPACE/bin/$key/tollgate-wrt" \
              -trimpath -buildvcs=false -ldflags="$LDFLAGS" main.go

            GOOS=linux GOARCH=$goarch GOARM=${goarm:-} GOMIPS=${gomips:-} \
              go build -C src/cmd/tollgate-cli -o "$GITHUB_WORKSPACE/bin/$key/tollgate" \
              -trimpath -buildvcs=false -ldflags="$CLI_LDFLAGS"

            ls -lh "bin/$key/"
          done < <(printf '%s' "$TARGETS" | jq -c '.[]')

      - name: Install nak
        run: |
          curl -L "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Upload binaries to Blossom (per-arch, mirrored)
        id: blossom-upload
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
        run: |
          set -euo pipefail

          blossom_upload() {
            local file="$1"
            local hash="" ok=0
            for server in $BLOSSOM_SERVERS; do
              local attempt=1 delay=2
              while [ $attempt -le 3 ]; do
                resp=$(nak blossom upload --server "$server" --sec "$NSEC_HEX" "$file" < /dev/null 2>&1) || true
                srv_hash=$(printf '%s' "$resp" | jq -r '.sha256 // empty' 2>/dev/null || echo "")
                if [ -n "$srv_hash" ] && [ "$srv_hash" != "null" ]; then
                  ok=$((ok + 1))
                  [ -z "$hash" ] && hash="$srv_hash"
                  echo "  ok: ${server} -> ${srv_hash}" >&2
                  break
                fi
                echo "  attempt $attempt to ${server} failed; retrying in ${delay}s..." >&2
                echo "  nak output: $(printf '%s' "$resp" | tail -1)" >&2
                sleep $delay
                delay=$((delay * 2))
                attempt=$((attempt + 1))
              done
            done
            if [ "$ok" -lt "$BLOSSOM_MIN_SUCCESS" ]; then
              echo "ERROR: only ${ok} mirrors succeeded for $(basename "$file") (need >= ${BLOSSOM_MIN_SUCCESS})" >&2
              return 1
            fi
            echo "  ${ok}/$(echo $BLOSSOM_SERVERS | wc -w) mirrors ok" >&2
            printf '%s' "$hash"
          }

          HASH_JSON="{}"
          for key_dir in bin/*/; do
            key=$(basename "$key_dir")
            tar czf "binaries-${key}.tar.gz" -C "bin/$key" .
            echo "Uploading binaries-${key}.tar.gz ($(stat -c%s "binaries-${key}.tar.gz") bytes)..."
            hash=$(blossom_upload "binaries-${key}.tar.gz")
            echo "  → $hash"
            HASH_JSON=$(printf '%s' "$HASH_JSON" | jq -c --arg k "$key" --arg h "$hash" '. + {($k): $h}')
          done

          echo "hashes=$HASH_JSON" >> $GITHUB_OUTPUT
          echo "All uploads complete: $HASH_JSON"

  build-portal:
    timeout-minutes: 15
    # The publish pipeline (Blossom upload + Nostr publish) needs the NSEC_HEX
    # secret, which GitHub withholds from fork PRs. Skip the whole pipeline for
    # fork PRs so they don't go red on an empty NSEC_HEX; same-repo PRs and
    # pushes run as normal. Downstream jobs (package-ipk/apk, publish-metadata,
    # trigger-build-os) inherit this via `needs:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      portal_sha: ${{ steps.portal-sha.outputs.portal_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js for portal build
        uses: actions/setup-node@v4
        with:
          # Pinned to the portal's declared toolchain (see its package.json
          # engines and packaging/build-inputs.json). node 22.17.0 bundles
          # npm 10.9.2 — verified in the next step.
          node-version: '22.17.0'

      - name: Verify pinned npm version
        run: |
          set -euo pipefail
          EXPECTED_NPM=$(jq -r '.npm.version' packaging/build-inputs.json)
          ACTUAL_NPM=$(npm --version)
          if [ "$ACTUAL_NPM" != "$EXPECTED_NPM" ]; then
            echo "ERROR: npm $ACTUAL_NPM != pinned $EXPECTED_NPM (packaging/build-inputs.json)" >&2
            exit 1
          fi

      - name: Build captive portal assets
        run: |
          set -euo pipefail
          # Portal revision is pinned by SHA in packaging/build-inputs.json;
          # portal-build.sh rejects anything else in reproducible mode.
          bash packaging/portal-build.sh
          echo "Portal assets built:"
          ls -la packaging/files/tollgate-captive-portal-site/assets/ || true

      - name: Assert portal bundle contract
        run: |
          # Fails when the pinned revision carries the keyset-requiring token
          # decode (#CU102) or when the committed bundle drifted from what the
          # pin builds. Uses the checkout portal-build.sh just made in
          # /tmp/tollgate-captive-portal-site.
          bash tests/packaging/assert-portal-bundle-contract.sh

      - name: Resolve portal commit SHA
        id: portal-sha
        run: |
          set -euo pipefail
          PORTAL_SHA=$(git -C /tmp/tollgate-captive-portal-site rev-parse HEAD)
          echo "portal_sha=$PORTAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Captive portal built from commit \`$PORTAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portal assets
        uses: actions/upload-artifact@v4
        with:
          name: portal-assets
          path: packaging/files/tollgate-captive-portal-site/
          retention-days: 7

      # portal-build.sh owns FIVE gitignored build products (guest SPA, admin
      # SPA, rpcd plugin, rpcd ACL, admin uci-default) and packaging/Makefile -
      # the recipe the SDK apk lane compiles - installs all five. The artifact
      # above carries only the guest SPA, so the apk job's tree was missing the
      # other four and its compile died at
      #   install: cannot stat '.../files/etc/uci-defaults/92-tollgate-admin-setup'
      # (measured on the 2026-09-24 run). Hand the apk lane the whole set as one
      # tarball of repository-relative paths, so what it unpacks is exactly the
      # tree portal-build.sh produced - no per-file list to drift, and no
      # dependency on how an artifact root maps onto a checkout.
      - name: Stage the generated portal files for the apk lane
        run: |
          set -euo pipefail
          STAGE=/var/tmp/portal-generated
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for p in \
              packaging/files/tollgate-captive-portal-site \
              packaging/files/tollgate-admin \
              packaging/files/usr/libexec/rpcd/tollgate \
              packaging/files/usr/share/rpcd/acl.d/tollgate.json \
              packaging/files/etc/uci-defaults/92-tollgate-admin-setup ; do
            if [ ! -e "$p" ]; then
              echo "ERROR: portal-build.sh produced no $p - refusing to hand the apk lane a partial bundle" >&2
              exit 1
            fi
            mkdir -p "$STAGE/$(dirname "$p")"
            cp -a "$p" "$STAGE/$(dirname "$p")/"
          done
          tar czf /var/tmp/portal-generated.tar.gz -C "$STAGE" .
          echo "tarball: $(stat -c%s /var/tmp/portal-generated.tar.gz) bytes"
          tar tzf /var/tmp/portal-generated.tar.gz | sed -n '1,12p'
          tar tzf /var/tmp/portal-generated.tar.gz | wc -l

      - name: Upload the generated portal files for the apk lane
        uses: actions/upload-artifact@v4
        with:
          name: portal-generated-tar
          path: /var/tmp/portal-generated.tar.gz
          retention-days: 7

  package-ipk:
    timeout-minutes: 30
    needs: [define-package-matrix, determine-versioning, compile-binaries, build-portal]
    runs-on: ubuntu-latest
    strategy:
      # Fail fast: the happy-path gate runs after packaging, so there is nothing
      # to gain from finishing twelve more architectures once one has failed -
      # publish-metadata is gated on the gate, not on the matrix completing.
      fail-fast: true
      matrix: ${{ fromJson(needs.define-package-matrix.outputs.ipk_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download prebuilt binaries from Blossom
        env:
          HASHES_JSON: ${{ needs.compile-binaries.outputs.hashes }}
        run: |
          set -euo pipefail
          BINARIES_HASH=$(printf '%s' "$HASHES_JSON" | jq -r '."${{ matrix.compile_key }}"')
          if [ -z "$BINARIES_HASH" ] || [ "$BINARIES_HASH" = "null" ]; then
            echo "ERROR: no Blossom hash for compile_key=${{ matrix.compile_key }}" >&2
            exit 1
          fi
          DOWNLOADED=false
          for server in $BLOSSOM_SERVERS; do
            if curl -fsSL -o binaries.tar.gz "${server}/${BINARIES_HASH}"; then
              DOWNLOADED=true
              echo "Downloaded from ${server}"
              break
            fi
          done
          if [ "$DOWNLOADED" != "true" ]; then
            echo "ERROR: failed to download binaries from any mirror" >&2
            exit 1
          fi
          mkdir -p bin
          tar xzf binaries.tar.gz -C bin
          ls -lh bin/

      - name: Install UPX
        if: contains(matrix.compression, 'upx')
        run: |
          set -euo pipefail
          # Pinned UPX (version + sha256 in packaging/build-inputs.json);
          # apt's upx-ucl floats and its output IS part of the artifact.
          bash scripts/fetch-upx.sh
          echo "$HOME/.cache/tollgate-tools/upx/$(jq -r '.upx.version' packaging/build-inputs.json)" >> "$GITHUB_PATH"

      - name: Download portal assets
        uses: actions/download-artifact@v4
        with:
          name: portal-assets
          path: packaging/files/tollgate-captive-portal-site/

      - name: Build .ipk
        run: |
          set -euo pipefail
          COMPRESSION_SUFFIX=""
          [ -n "${{ matrix.compression }}" ] && COMPRESSION_SUFFIX="-${{ matrix.compression }}"
          PACKAGE_FILENAME=${PACKAGE_NAME}_${{ needs.determine-versioning.outputs.package_version }}_${{ matrix.architecture }}${COMPRESSION_SUFFIX}.ipk
          echo "PACKAGE_FILENAME=$PACKAGE_FILENAME" >> $GITHUB_ENV

          PAYLOAD=$(mktemp -d)
          install -D -m 0755 bin/tollgate-wrt "$PAYLOAD/usr/bin/tollgate-wrt"
          install -D -m 0755 bin/tollgate     "$PAYLOAD/usr/bin/tollgate"

          install -D -m 0755 packaging/files/etc/init.d/tollgate-wrt                         "$PAYLOAD/etc/init.d/tollgate-wrt"
          install -D -m 0755 packaging/files/etc/uci-defaults/90-tollgate-captive-portal-symlink "$PAYLOAD/etc/uci-defaults/90-tollgate-captive-portal-symlink"
          # 99-tollgate-setup ships the release version as the
          # __TOLLGATE_VERSION__ placeholder; substitute the same version that
          # the binaries and the control file use (VERSION at the repository
          # root is the single source of truth — see CONTRIBUTING.md,
          # "Version single source of truth").
          sed "s|__TOLLGATE_VERSION__|${{ needs.determine-versioning.outputs.package_version }}|g" \
            packaging/files/etc/uci-defaults/99-tollgate-setup > "$PAYLOAD/etc/uci-defaults/99-tollgate-setup"
          chmod 0755 "$PAYLOAD/etc/uci-defaults/99-tollgate-setup"
          install -D -m 0755 packaging/files/usr/local/bin/first-login-setup                 "$PAYLOAD/usr/local/bin/first-login-setup"
          install -D -m 0755 packaging/files/usr/bin/check_package_path                      "$PAYLOAD/usr/bin/check_package_path"
          install -D -m 0644 packaging/files/lib/upgrade/keep.d/tollgate                     "$PAYLOAD/lib/upgrade/keep.d/tollgate"
          install -D -m 0755 packaging/files/etc/hotplug.d/iface/95-tollgate-restart         "$PAYLOAD/etc/hotplug.d/iface/95-tollgate-restart"

          # Install the ruleset directory's *.nft files: a new ruleset file
          # under packaging/files/etc/nftables.d/ must ship without a second
          # edit here (missing 30-backend-firewall.nft left the backend API on
          # :2121 reachable from non-br-lan interfaces). Only *.nft is copied —
          # the same set the OpenWrt recipe installs — so a stray non-ruleset
          # file (README, *.nft.bak, editor backup) cannot slip into the .ipk.
          mkdir -p "$PAYLOAD/etc/nftables.d"
          cp packaging/files/etc/nftables.d/*.nft "$PAYLOAD/etc/nftables.d/"

          mkdir -p \
            "$PAYLOAD/etc/tollgate/tollgate-captive-portal-site" \
            "$PAYLOAD/etc/tollgate/ecash" \
            "$PAYLOAD/etc/crontabs"
          cp -r packaging/files/tollgate-captive-portal-site/. "$PAYLOAD/etc/tollgate/tollgate-captive-portal-site/"
          install -D -m 0644 LICENSE "$PAYLOAD/usr/share/doc/${PACKAGE_NAME}/LICENSE"

          if [ -n "${{ matrix.compression }}" ]; then
            COMP="${{ matrix.compression }}"
            UPX_FLAGS="--${COMP#upx-}"
            ls -lh "$PAYLOAD/usr/bin/tollgate-wrt" "$PAYLOAD/usr/bin/tollgate"
            upx $UPX_FLAGS "$PAYLOAD/usr/bin/tollgate-wrt"
            upx $UPX_FLAGS "$PAYLOAD/usr/bin/tollgate"
            ls -lh "$PAYLOAD/usr/bin/tollgate-wrt" "$PAYLOAD/usr/bin/tollgate"
          fi

          mkdir -p artifacts
          # nodogsplash is a RUNTIME dependency (the module gates the network
          # through the daemon): Replaces: it would purge the captive portal on
          # install. Kept in step with packaging/local-build-ipk.sh by
          # tests/packaging/package-nodogsplash-dependency_test.sh.
          env \
            PKG_NAME="$PACKAGE_NAME" \
            PKG_VERSION="${{ needs.determine-versioning.outputs.package_version }}" \
            ARCH="${{ matrix.architecture }}" \
            MAINTAINER="TollGate <tollgate@tollgate.me>" \
            LICENSE="GPL-3.0-only" \
            DEPENDS="libc, nodogsplash, jq" \
            PROVIDES="nodogsplash-files" \
            REPLACES="base-files" \
            DESCRIPTION="TollGate Basic Module for OpenWrt" \
            packaging/build-ipk.sh "$PAYLOAD" "artifacts/$PACKAGE_FILENAME"

      - name: Verify packaged runtime files
        run: bash tests/packaging/assert-artifact-contents.sh "artifacts/$PACKAGE_FILENAME"

      - name: Install nak
        run: |
          curl -L "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak

      - name: Upload to Blossom and announce
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
          BUILD_ID: ${{ needs.determine-versioning.outputs.build_id }}
        run: |
          set -euo pipefail

          PKG_FILE="artifacts/$PACKAGE_FILENAME"
          PKG_HASH="" ok=0
          OK_SERVERS=()
          for server in $BLOSSOM_SERVERS; do
            attempt=1; delay=2
            while [ $attempt -le 3 ]; do
              resp=$(nak blossom upload --server "$server" --sec "$NSEC_HEX" "$PKG_FILE" < /dev/null 2>&1) || true
              srv_hash=$(printf '%s' "$resp" | jq -r '.sha256 // empty' 2>/dev/null || echo "")
              if [ -n "$srv_hash" ] && [ "$srv_hash" != "null" ]; then
                ok=$((ok + 1))
                [ -z "$PKG_HASH" ] && PKG_HASH="$srv_hash"
                OK_SERVERS+=("$server")
                echo "  ok: ${server} -> ${srv_hash}" >&2
                break
              fi
              echo "  attempt $attempt to ${server} failed; retrying in ${delay}s..." >&2
              echo "  nak output: $(printf '%s' "$resp" | tail -1)" >&2
              sleep $delay
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          done
          if [ "$ok" -lt "$BLOSSOM_MIN_SUCCESS" ]; then
            echo "ERROR: only ${ok} mirrors succeeded (need >= ${BLOSSOM_MIN_SUCCESS})" >&2
            exit 1
          fi
          echo "  ${ok}/$(echo $BLOSSOM_SERVERS | wc -w) mirrors ok" >&2

          PKG_URLS_JSON="[]"
          for s in "${OK_SERVERS[@]}"; do
            PKG_URLS_JSON=$(printf '%s' "$PKG_URLS_JSON" | jq -c --arg u "${s}/${PKG_HASH}.ipk" '. + [$u]')
          done
          compression_tag="${{ matrix.compression }}"
          [ -z "$compression_tag" ] && compression_tag="none"

          COORD_CONTENT=$(jq -cn \
            --arg sha256 "$PKG_HASH" \
            --arg filename "$PACKAGE_FILENAME" \
            --argjson urls "$PKG_URLS_JSON" \
            --arg arch "${{ matrix.architecture }}" \
            --arg fmt "ipk" \
            --arg compression "$compression_tag" \
            '{sha256:$sha256, filename:$filename, urls:$urls, architecture:$arch, format:$fmt, compression:$compression}')

          nak event --sec "$NSEC_HEX" -k 30078 \
            --tag "d=tollgate-build/${BUILD_ID}/${{ matrix.architecture }}/ipk/${compression_tag}" \
            --tag "r=${BUILD_ID}" \
            --tag "t=tollgate-build" \
            -c "$COORD_CONTENT" \
            $COORDINATION_RELAYS < /dev/null

          echo "Uploaded $PACKAGE_FILENAME → $PKG_HASH"

  package-apk:
    timeout-minutes: 90
    needs: [define-package-matrix, determine-versioning, compile-binaries, build-portal]
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ matrix.sdk }}-25.12.0@${{ matrix.digest }}
      options: --user root
    strategy:
      # Fail fast: the happy-path gate runs after packaging, so there is nothing
      # to gain from finishing the remaining architectures once one has failed -
      # publish-metadata is gated on the gate, not on the matrix completing.
      fail-fast: true
      matrix: ${{ fromJson(needs.define-package-matrix.outputs.apk_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: src-checkout
          fetch-depth: 1

      - name: Install build tools
        # Container jobs default to `sh`, where `set -o pipefail` is illegal and
        # the step dies with "sh: 1: set: Illegal option -o pipefail". Ask for
        # bash explicitly, as the other steps in this job already do.
        shell: bash
        run: |
          set -euo pipefail
          # Do NOT apt-install these. The pinned openwrt/sdk image is Debian
          # bullseye, whose security pool goes 404 once bullseye leaves LTS, so
          # `apt-get install -y curl jq` dies inside the container
          # ("E: Failed to fetch ... 404  Not Found", "Process completed with exit
          # code 100") and takes every apk job with it - measured on the
          # 2026-09-17 and 2026-09-12 fork runs, where all three package-apk jobs
          # failed there and publish-metadata was skipped as a result. curl ships
          # in the image; jq does not, so take jq from its pinned upstream release
          # the same way the nak install below does.
          if ! command -v curl >/dev/null 2>&1; then
            apt-get update && apt-get install -y curl
          fi
          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL -o /usr/local/bin/jq \
              https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x /usr/local/bin/jq
          fi
          curl --version | head -1
          jq --version

      - name: Install nak
        run: |
          curl -L "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Download prebuilt binaries from Blossom
        shell: bash
        env:
          HASHES_JSON: ${{ needs.compile-binaries.outputs.hashes }}
        run: |
          set -euo pipefail
          BINARIES_HASH=$(printf '%s' "$HASHES_JSON" | jq -r '."${{ matrix.compile_key }}"')
          if [ -z "$BINARIES_HASH" ] || [ "$BINARIES_HASH" = "null" ]; then
            echo "ERROR: no Blossom hash for compile_key=${{ matrix.compile_key }}" >&2
            exit 1
          fi
          DOWNLOADED=false
          for server in $BLOSSOM_SERVERS; do
            if curl -fsSL -o binaries.tar.gz "${server}/${BINARIES_HASH}"; then
              DOWNLOADED=true
              echo "Downloaded from ${server}"
              break
            fi
          done
          if [ "$DOWNLOADED" != "true" ]; then
            echo "ERROR: failed to download binaries from any mirror" >&2
            exit 1
          fi
          mkdir -p bin
          tar xzf binaries.tar.gz -C bin
          ls -lh bin/

      - name: Install UPX
        if: contains(matrix.compression, 'upx')
        # Container jobs default to `sh`, where `set -o pipefail` is illegal and
        # the step dies with "sh: 1: set: Illegal option -o pipefail". This step
        # was the first red in the apk lane once the apt-404 below was fixed, and
        # with `fail-fast: true` it cancels the x86_64 apk job - the one the
        # happy-path gate consumes - so a broken upx row would leave the gate
        # unreachable. Ask for bash explicitly, as the other steps here do.
        shell: bash
        run: |
          set -euo pipefail
          # Pinned UPX (version + sha256 in packaging/build-inputs.json);
          # apt's upx-ucl floats and its output IS part of the artifact.
          bash src-checkout/scripts/fetch-upx.sh
          echo "$HOME/.cache/tollgate-tools/upx/$(jq -r '.upx.version' src-checkout/packaging/build-inputs.json)" >> "$GITHUB_PATH"

      - name: Download the generated portal file tarball
        uses: actions/download-artifact@v4
        with:
          name: portal-generated-tar
          path: /var/tmp

      - name: Unpack the generated portal files into the source tree
        shell: bash
        run: |
          set -euo pipefail
          # The tree portal-build.sh produced, at repository-relative paths:
          # the guest SPA, the admin SPA, the rpcd plugin and its ACL, and the
          # admin uci-default. packaging/Makefile installs all five, so a
          # guest-SPA-only artifact leaves the compile red
          # ("install: cannot stat '.../92-tollgate-admin-setup'", 2026-09-24).
          tar xzf /var/tmp/portal-generated.tar.gz -C src-checkout
          # The guest SPA's entry file is splash.html (the bundle has no
          # index.html - the admin webroot is the one with index.html), so this
          # asserts each product is present rather than guessing an entry name:
          # a non-empty guest SPA plus the four named products.
          [ -n "$(ls -A src-checkout/packaging/files/tollgate-captive-portal-site)" ] \
            || { echo "ERROR: the guest SPA bundle is empty" >&2; exit 1; }
          for p in \
              src-checkout/packaging/files/tollgate-captive-portal-site/splash.html \
              src-checkout/packaging/files/tollgate-admin/index.html \
              src-checkout/packaging/files/usr/libexec/rpcd/tollgate \
              src-checkout/packaging/files/usr/share/rpcd/acl.d/tollgate.json \
              src-checkout/packaging/files/etc/uci-defaults/92-tollgate-admin-setup ; do
            [ -e "$p" ] || { echo "ERROR: missing generated portal file $p" >&2; exit 1; }
          done
          ls -l src-checkout/packaging/files/etc/uci-defaults/ \
                src-checkout/packaging/files/tollgate-captive-portal-site/ | head -20

      - name: Restore SDK build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /builder/dl
            /builder/staging_dir
            /builder/build_dir
          key: apk-sdk-${{ matrix.sdk }}-25.12.0-${{ hashFiles('packaging/**') }}
          restore-keys: |
            apk-sdk-${{ matrix.sdk }}-25.12.0-

      - name: Stage SDK package tree
        run: |
          set -eu
          COMPRESSION_SUFFIX=""
          [ -n "${{ matrix.compression }}" ] && COMPRESSION_SUFFIX="-${{ matrix.compression }}"
          PACKAGE_FILENAME=${PACKAGE_NAME}_${{ needs.determine-versioning.outputs.package_version }}_${{ matrix.architecture }}${COMPRESSION_SUFFIX}.apk
          echo "PACKAGE_FILENAME=$PACKAGE_FILENAME" >> $GITHUB_ENV

          STAGE=/builder/package/${PACKAGE_NAME}
          mkdir -p "$STAGE"
          cp -r src-checkout/packaging/. "$STAGE/"
          cp src-checkout/LICENSE "$STAGE/LICENSE"
          install -m 0755 bin/tollgate-wrt "$STAGE/tollgate-wrt"
          install -m 0755 bin/tollgate     "$STAGE/tollgate"

      - name: Normalize staged mtimes to SOURCE_DATE_EPOCH
        # apk package metadata is sensitive to staged file mtimes; pin them
        # to the source commit epoch so rebuilds are byte-identical.
        env:
          SOURCE_DATE_EPOCH: ${{ needs.compile-binaries.outputs.epoch }}
        run: |
          set -eu
          find /builder/package -exec touch -d "@${SOURCE_DATE_EPOCH}" {} +

      - name: Configure SDK
        run: |
          cd /builder
          make defconfig
          {
            echo "CONFIG_PACKAGE_${PACKAGE_NAME}=y"
            echo "CONFIG_PACKAGE_nodogsplash=y"
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_jq=y"
            echo "CONFIG_USE_APK=y"
          } >> .config
          make defconfig

      - name: Compile package
        shell: bash
        run: |
          cd /builder
          if [ -n "${{ matrix.compression }}" ]; then
            export USE_UPX=1
            COMP="${{ matrix.compression }}"
            export UPX_FLAGS="--${COMP#upx-}"
          else
            export USE_UPX=0
          fi
          env \
            PACKAGE_VERSION=${{ needs.determine-versioning.outputs.package_version }} \
            USE_UPX=$USE_UPX \
            UPX_FLAGS="$UPX_FLAGS" \
            make -j$(nproc) ${{ env.DEBUG == 'true' && 'V=sc' || '' }} package/${PACKAGE_NAME}/compile

      - name: Verify packaged runtime files
        # Same container/shell trap as "Install UPX" above: this step runs in the
        # openwrt/sdk image, whose /bin/sh is dash, where `set -o pipefail` is
        # illegal. Without this line every apk row dies here ("sh: 1: set:
        # Illegal option -o pipefail") before the artifact is ever built, so the
        # x86_64 .apk the happy-path gate consumes never exists.
        shell: bash
        run: |
          set -euo pipefail
          # Select THIS package's artifact, not the first *.apk anywhere under
          # bin/packages: the build tree also holds other packages' .apk files,
          # and testing one of those would validate nothing (or pass spuriously).
          PKG_DIR="/builder/bin/packages/${{ matrix.architecture }}"
          PKG=$(find "$PKG_DIR" -maxdepth 2 -type f -name "${PACKAGE_NAME}-*.apk" 2>/dev/null | sort || true)
          PKG_N=$(printf '%s\n' "$PKG" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$PKG_N" -ne 1 ]; then
            echo "FAIL: expected exactly one ${PACKAGE_NAME}-*.apk under $PKG_DIR," >&2
            echo "      found $PKG_N candidate(s):" >&2
            printf '%s\n' "${PKG:-<none>}" >&2
            find "$PKG_DIR" -maxdepth 3 -type f -name '*.apk' >&2 || true
            exit 1
          fi
          echo "APK artifact: $PKG"
          ls -l "$PKG"
          APK_BIN=$(command -v apk || echo /builder/staging_dir/host/bin/apk)
          export APK_BIN
          echo "APK_BIN=$APK_BIN"
          bash src-checkout/tests/packaging/assert-artifact-contents.sh "$PKG"

      # Hand the one architecture the happy-path gate can execute to that gate.
      # The suite boots the package's own binary, so the bytes it exercises are
      # the bytes this run is about to publish; x86_64 is the only architecture
      # whose binary runs natively on the ubuntu-latest runner. Staged under the
      # published filename so the gate has no version string to reconstruct.
      # (The apk matrix holds exactly one x86_64 entry - no compression variant -
      # so the architecture test alone is the right filter.)
      - name: Stage the x86_64 package for the happy-path gate
        if: matrix.architecture == 'x86_64'
        # Container jobs default to `sh`, where `set -o pipefail` is illegal.
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(find "/builder/bin/packages/${{ matrix.architecture }}" -maxdepth 2 -type f \
                  -name "${PACKAGE_NAME}-*.apk" | sort | head -1)
          [ -n "$PKG" ] || { echo "ERROR: no ${PACKAGE_NAME}-*.apk to hand to the gate" >&2; exit 1; }
          mkdir -p /github/workspace/happy-path-pkg
          cp "$PKG" "/github/workspace/happy-path-pkg/${PACKAGE_FILENAME}"
          ls -l /github/workspace/happy-path-pkg/

      - name: Upload the x86_64 package for the happy-path gate
        if: matrix.architecture == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: happy-path-apk
          path: /github/workspace/happy-path-pkg/${{ env.PACKAGE_FILENAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Collect, upload to Blossom, and announce
        shell: bash
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
          BUILD_ID: ${{ needs.determine-versioning.outputs.build_id }}
        run: |
          set -euo pipefail
          PACKAGE_PATH=$(find /builder/bin/packages -name "*.apk" -type f | head -n1)
          if [ -z "$PACKAGE_PATH" ]; then
            echo "No .apk package found" >&2
            find /builder/bin -maxdepth 5 -type f | head -50
            exit 1
          fi
          ls -lh "$PACKAGE_PATH"
          mkdir -p /github/workspace
          cp "$PACKAGE_PATH" "/github/workspace/${PACKAGE_FILENAME}"

          PKG_FILE="/github/workspace/${PACKAGE_FILENAME}"
          PKG_HASH="" ok=0
          OK_SERVERS=()
          for server in $BLOSSOM_SERVERS; do
            attempt=1; delay=2
            while [ $attempt -le 3 ]; do
              resp=$(nak blossom upload --server "$server" --sec "$NSEC_HEX" "$PKG_FILE" < /dev/null 2>&1) || true
              srv_hash=$(printf '%s' "$resp" | jq -r '.sha256 // empty' 2>/dev/null || echo "")
              if [ -n "$srv_hash" ] && [ "$srv_hash" != "null" ]; then
                ok=$((ok + 1))
                [ -z "$PKG_HASH" ] && PKG_HASH="$srv_hash"
                OK_SERVERS+=("$server")
                echo "  ok: ${server} -> ${srv_hash}" >&2
                break
              fi
              echo "  attempt $attempt to ${server} failed; retrying in ${delay}s..." >&2
              echo "  nak output: $(printf '%s' "$resp" | tail -1)" >&2
              sleep $delay
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          done
          if [ "$ok" -lt "$BLOSSOM_MIN_SUCCESS" ]; then
            echo "ERROR: only ${ok} mirrors succeeded (need >= ${BLOSSOM_MIN_SUCCESS})" >&2
            exit 1
          fi
          echo "  ${ok}/$(echo $BLOSSOM_SERVERS | wc -w) mirrors ok" >&2

          PKG_URLS_JSON="[]"
          for s in "${OK_SERVERS[@]}"; do
            PKG_URLS_JSON=$(printf '%s' "$PKG_URLS_JSON" | jq -c --arg u "${s}/${PKG_HASH}.apk" '. + [$u]')
          done
          compression_tag="${{ matrix.compression }}"
          [ -z "$compression_tag" ] && compression_tag="none"

          COORD_CONTENT=$(jq -cn \
            --arg sha256 "$PKG_HASH" \
            --arg filename "$PACKAGE_FILENAME" \
            --argjson urls "$PKG_URLS_JSON" \
            --arg arch "${{ matrix.architecture }}" \
            --arg fmt "apk" \
            --arg compression "$compression_tag" \
            '{sha256:$sha256, filename:$filename, urls:$urls, architecture:$arch, format:$fmt, compression:$compression}')

          nak event --sec "$NSEC_HEX" -k 30078 \
            --tag "d=tollgate-build/${BUILD_ID}/${{ matrix.architecture }}/apk/${compression_tag}" \
            --tag "r=${BUILD_ID}" \
            --tag "t=tollgate-build" \
            -c "$COORD_CONTENT" \
            $COORDINATION_RELAYS < /dev/null

          echo "Uploaded $PACKAGE_FILENAME → $PKG_HASH"

  # THE GATE. The happy path is exercised on the bytes this run is about to
  # publish, and the release does not proceed if it is broken: publish-metadata
  # needs this job, with no `if: always()`, so a red suite skips the release
  # fail-closed. This is the operator's standing rule made mechanical - publish
  # AFTER the tests.
  #
  # Why it exists: the happy path broke three times in ways only manual testing
  # caught - a stale vendored portal bundle, a renewal-after-expiry dead end, and
  # a Lightning lane that could not buy time (found by this suite, after the
  # release had shipped). The suite that catches all three (tests/happy-path/,
  # #544) existed but nothing ran it automatically.
  #
  # The suite is offline - no secret, no Cashu token, no payment, no real mint -
  # so it is safe to run unattended and safe on a same-repo pull_request.
  happy-path:
    name: Happy path (suite on the built .apk, --strict)
    needs: [package-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Download the x86_64 package this run just built
        uses: actions/download-artifact@v4
        with:
          name: happy-path-apk
          path: happy-path-pkg

      # An OpenWrt .apk is a custom v3 format (NOT gzip/zstd), so it needs
      # apk-tools. Extracting it inside a throwaway container is the recipe in
      # tests/happy-path/README.md and avoids requiring OpenWrt's own apk on the
      # runner. The extracted tree is exactly what the module sees on a router.
      - name: Extract the package
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/hp-artifact
          cp happy-path-pkg/*.apk /var/tmp/hp-artifact/
          ls -l /var/tmp/hp-artifact/
          # `apk.static extract --destination <dir>` does NOT create <dir>: it
          # answers "ERROR: Error opening destination '/out/extracted': No such
          # file or directory" and exits 99 (measured, fork run 35944626755 job
          # 107462074261 - the gate's first execution). Create it on the HOST so
          # it is already there under the bind mount.
          mkdir -p /var/tmp/hp-artifact/extracted
          docker run --rm -v /var/tmp/hp-artifact:/out alpine:edge sh -c \
            'apk add --no-cache apk-tools-static >/dev/null &&
             /sbin/apk.static extract --allow-untrusted --destination /out/extracted /out/*.apk'
          du -sh /var/tmp/hp-artifact/extracted
          ls -l /var/tmp/hp-artifact/extracted/usr/bin/
          ls /var/tmp/hp-artifact/extracted/etc/tollgate/tollgate-captive-portal-site/ | head

      - name: Install the runner-side dependencies of the suite
        run: |
          set -euo pipefail
          # The artifact binary is musl x86_64: the suite runs it natively using
          # /lib/ld-musl-x86_64.so.1 (the `musl` package) and extracts the
          # matching libgcc_s.so.1 out of alpine:3.20 itself, so pre-pull that
          # image. Playwright drives the portal half in a real browser.
          sudo apt-get update
          sudo apt-get install -y musl
          docker pull alpine:3.20
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium

      # --strict is deliberate, not decoration: this artifact is built from a tip
      # that carries upstream #541 (/session-state) and a portal bundle that ships
      # the in-page renewal CTA (#60), so those surfaces are EXPECTED here and
      # their absence must fail the release rather than skip. That is precisely
      # the renewal-after-expiry dead end this gate is for.
      - name: Run the happy-path suite
        env:
          # How run.sh finds the interpreter that has playwright installed.
          HP_PYTHON: python3
        run: |
          set -euo pipefail
          # .github/scripts/happy-path-gate.sh runs the suite with --strict and
          # tolerates ONLY the check ids listed in tests/happy-path/known-issues.txt
          # (one documented, pre-existing defect: the Lightning lane's mint-URL
          # mismatch). Every other failure fails the release. See its header.
          bash .github/scripts/happy-path-gate.sh \
            --artifact /var/tmp/hp-artifact/extracted \
            --out "$RUNNER_TEMP/happy-path-evidence"

      - name: Upload the suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-path-evidence
          path: ${{ runner.temp }}/happy-path-evidence
          if-no-files-found: ignore
          retention-days: 7

  publish-metadata:
    # `happy-path` is in the needs list on purpose and there is deliberately no
    # `if: always()` on this job or the ones below it: a red happy path skips the
    # release, fail-closed, instead of publishing a broken build to every feed
    # consumer. verify-publication and trigger-build-os inherit this through
    # their own `needs:`.
    needs: [determine-versioning, package-ipk, package-apk, happy-path]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ubuntu:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      BUILD_ID: ${{ needs.determine-versioning.outputs.build_id }}
      PACKAGE_VERSION: ${{ needs.determine-versioning.outputs.package_version }}
      RELEASE_CHANNEL: ${{ needs.determine-versioning.outputs.release_channel }}
      RELAYS: "wss://relay.damus.io wss://nos.lol wss://nostr.mom wss://relay1.orangesync.tech wss://relay2.orangesync.tech"
    steps:
      - name: Install required tools
        run: |
          apt-get update
          apt-get install -y curl jq
          curl -L "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Fetch build results from relays
        run: |
          set -euo pipefail
          timeout 30 nak req -k 30078 --tag "r=$BUILD_ID" --limit 50 $COORDINATION_RELAYS > build-results.jsonl || true
          result_count=$(wc -l < build-results.jsonl)
          echo "Fetched $result_count build result(s) from relays."
          if [ "$result_count" -eq 0 ]; then
            echo "ERROR: no build results found for BUILD_ID=$BUILD_ID" >&2
            exit 1
          fi

      - name: Build NIP-94 events
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
        run: |
          set -euo pipefail
          : > events.jsonl
          while IFS= read -r evt; do
            content=$(printf '%s' "$evt" | jq -r '.content')
            arch=$(printf '%s' "$content" | jq -r '.architecture')
            fmt=$(printf '%s' "$content" | jq -r '.format')
            filename=$(printf '%s' "$content" | jq -r '.filename')
            hash=$(printf '%s' "$content" | jq -r '.sha256')
            compression=$(printf '%s' "$content" | jq -r '.compression')

            url_tags=()
            while IFS= read -r u; do
              url_tags+=(--tag "url=$u")
            done < <(printf '%s' "$content" | jq -r '.urls[]')

            nak event --sec "$NSEC_HEX" -k 1063 \
              -c "TollGate Package: ${PACKAGE_NAME} for ${arch}" \
              "${url_tags[@]}" \
              --tag m="application/octet-stream" \
              --tag x="$hash" \
              --tag ox="$hash" \
              --tag filename="$filename" \
              --tag A="$arch" \
              --tag v="$PACKAGE_VERSION" \
              --tag c="$RELEASE_CHANNEL" \
              --tag n="$PACKAGE_NAME" \
              --tag compression="$compression" \
              --tag format="$fmt" \
              $RELAYS \
              < /dev/null \
              | jq -c . >> events.jsonl
          done < build-results.jsonl

          event_count=$(wc -l < events.jsonl)
          echo "Built $event_count NIP-94 events."
          if [ "$event_count" -eq 0 ]; then
            echo "ERROR: no events built" >&2
            exit 1
          fi

      - name: Verify NIP-94 events published
        run: |
          set -euo pipefail
          echo "Events were published directly during the build step."
          echo "Event count: $(wc -l < events.jsonl)"

      - name: Cleanup coordination events
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
        run: |
          set -euo pipefail
          while IFS= read -r evt; do
            event_id=$(printf '%s' "$evt" | jq -r '.id')
            nak event --sec "$NSEC_HEX" -k 5 \
              --tag e="$event_id" \
              -c "build coordination cleanup" \
              $COORDINATION_RELAYS < /dev/null || true
          done < build-results.jsonl
          echo "Cleaned up 30078 coordination events."

      - name: Build summary
        run: |
          set -euo pipefail
          echo "Published $(wc -l < events.jsonl) NIP-94 events across $(echo $RELAYS | wc -w) relays."
          while IFS= read -r evt; do
            content=$(printf '%s' "$evt" | jq -r '.content')
            printf '%s' "$content" | jq -r '"  \(.architecture) \(.format)\(if .compression != "none" then "-\(.compression)" else "" end): \(.urls[0]) (+\(.urls | length - 1) mirrors)"'
          done < build-results.jsonl

  verify-publication:
    name: Verify channel publication (events + mirrors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [determine-versioning, define-package-matrix, publish-metadata]
    env:
      PACKAGE_VERSION: ${{ needs.determine-versioning.outputs.package_version }}
      RELEASE_CHANNEL: ${{ needs.determine-versioning.outputs.release_channel }}
    steps:
      - uses: actions/checkout@v6

      - name: Install nak
        run: |
          curl -L "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Verify events exist and mirrors serve correct sha256
        run: |
          bash scripts/verify_publication.sh \
            "$PACKAGE_VERSION" \
            "$RELEASE_CHANNEL" \
            '${{ needs.define-package-matrix.outputs.matrix }}'

  trigger-build-os:
    name: Trigger TollGate OS build
    runs-on: ubuntu-latest
    needs: [determine-versioning, publish-metadata, verify-publication]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: OpenTollGate/tollgate-os
          event-type: build-os
          client-payload: |-
            {
              "override_tollgate_wrt_version": "${{ needs.determine-versioning.outputs.package_version }}"
            }
