# docker-compose.conformance.yml — override for the conformance lane
# (conformance/run-conformance.sh). Adds the PRTA mint fault proxy as a lab
# service between the daemon and the mint: the generated
# .conformance/runtime-config.json points accepted_mints at it, and both the
# daemon and cdk-cli in the client reach it by service DNS name.
#
# The proxy's build context (.conformance/proxy-build/) is generated by the
# runner: it copies PRTA's faultproxy.py verbatim next to a trivial
# Dockerfile. The matrix and proxy are co-owned in PRTA and are never forked
# into this repo (#503).
#
# Port 9090 is published so the HOST runner can drive the proxy control
# endpoint (/__fault/control, /__fault/state, /__fault/observations).
# Container->host traffic is NOT used (it is firewalled on many hosts, this
# one included) — the kill lane reads the proxy state from the host and
# docker-kills the daemon from the host.
#
# Usage (from tests/cloud-lab/, orchestrated by conformance/run-conformance.sh):
#   docker compose -f docker-compose.yml -f docker-compose.conformance.yml up -d mint upstream faultproxy
services:
  faultproxy:
    build:
      context: ./.conformance/proxy-build
    container_name: tg-faultproxy
    command: ["--upstream", "http://mint:8085", "--listen", "0.0.0.0:9090"]
    # Loopback-pinned: this is a control endpoint that rewrites fault
    # rules at runtime — it must not be reachable off-host.
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      tollgate-lab:
        # Static on purpose: the base file pins static IPs for its services,
        # and a dynamically allocated proxy could race one of them for the
        # low addresses when it starts first.
        ipv4_address: 172.28.0.30

  upstream:
    volumes:
      - ./.conformance/runtime-config.json:/etc/tollgate/config.json
