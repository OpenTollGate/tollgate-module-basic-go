# docker-compose.zoo.yml — mint-matrix overlay (run-mint-matrix.sh).
# Self-contained: brings its own router (upstream-matrix) whose config is
# the per-run generated zoo-mint-config.json (base mints + matrix targets,
# gitignored). Deliberately independent of the external-mints lane's
# upstream-ext so the two PRs cannot block each other.
services:
  client:
    volumes: !override
      - .:/tests
      - ./matrix-wallets:/matrix-wallets
  upstream-matrix:
    build:
      context: ../..
      dockerfile: tests/cloud-lab/Dockerfile.tollgate
    container_name: tg-upstream-matrix
    profiles: ["external-mints"]
    depends_on:
      mint:
        condition: service_healthy
    environment:
      - TOLLGATE_TEST_CONFIG_DIR=/etc/tollgate
      - TOLLGATE_RATE_LIMIT_RPM=600
    volumes:
      - ./zoo-mint-config.json:/etc/tollgate/config.json
      - ./configs/install.json:/etc/tollgate/install.json
      - ./configs/dhcp.leases:/tmp/dhcp.leases
    ports:
      - "21215:2121"
    networks:
      tollgate-lab:
        ipv4_address: 172.28.0.13
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2121/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
