repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # packaging/files/tollgate-captive-portal-site/ and tollgate-admin/ are
      # generated by packaging/portal-build.sh from the portal commit pinned in
      # packaging/build-inputs.json. These fixers must not rewrite them, or the
      # committed copy stops being byte-identical to the pinned build output
      # (guarded by tests/packaging/assert-portal-bundle-contract.sh).
      - id: trailing-whitespace
        exclude: ^packaging/files/(tollgate-captive-portal-site|tollgate-admin)/
      - id: end-of-file-fixer
        exclude: ^packaging/files/(tollgate-captive-portal-site|tollgate-admin)/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
