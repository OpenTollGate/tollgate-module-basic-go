repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # packaging/files/tollgate-captive-portal-site/ and tollgate-admin/ are
      # generated by packaging/portal-build.sh from the portal commit pinned in
      # packaging/build-inputs.json. These fixers must not rewrite them, or the
      # committed copy stops being byte-identical to the pinned build output
      # (guarded by tests/packaging/assert-portal-bundle-contract.sh).
      - id: trailing-whitespace
        exclude: ^packaging/files/(tollgate-captive-portal-site|tollgate-admin)/
      - id: end-of-file-fixer
        exclude: ^packaging/files/(tollgate-captive-portal-site|tollgate-admin)/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # gitleaks replaces the retired Yelp detect-secrets baseline (.secrets.baseline):
  # the documented hook convention (`git config core.hooksPath hooks`) bypasses
  # the pre-commit framework entirely, so the baseline was unenforced for anyone
  # following the docs — gitleaks runs in BOTH lanes (hooks/pre-commit and here).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
