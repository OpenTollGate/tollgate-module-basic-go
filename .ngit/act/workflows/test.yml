name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - src/config_manager
          - src/utils
          - src/cmd/tollgate-cli
          - src/lightning
          - src/merchant
          - src/tollgate_protocol
          - src/tollwallet
          - src/valve
          - src/wireless_gateway_manager
          # NOTE: src/cli, src/upstream_detector and
          # src/upstream_session_manager are intentionally omitted. They
          # transitively pull in the lnd -> ltcsuite/ltcd chain, which only
          # builds standalone after an invasive go.mod rewrite (an `exclude`
          # directive plus a full re-tidy). They still build/test as part of
          # the root module's build; adding them here is tracked separately.
          # src/merchant was added once its go.mod gained the ltcsuite/ltcd
          # `exclude` directive and a full re-tidy (PR #361).
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test-summary.sh" "${{ matrix.module }}" ./... -v -count=1 -race

  main-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Run main package tests
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test-summary.sh" "main package (testenv)" -v -count=1 -race -tags testenv .

  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Changelog fragments: a change's entry is its own file under changelog.d/
      # instead of a hunk in CHANGELOG.md, so two pull requests can never edit the
      # same lines (docs/architecture/changelog-fragments-decision.md). This
      # validates the fragments and the tool that folds them into the release
      # section, and runs the tool's contract test.
      - name: Changelog fragments (names, bodies, fold tool)
        run: |
          python3 scripts/changelog-assemble.py check
          bash tests/contract/changelog-fragments_test.sh

      - name: Schema lint
        run: node tests/contract/js-schema-lint.mjs

      - name: Doc-facts contract (docs that state facts must match the code)
        run: python3 tests/contract/check-docs-facts.py

      - name: Setup-marker ordering (roll-back safety)
        run: |
          # Offline (no router, no SDK, no network): the setup script's version
          # marker must be compared BY ORDER, not for equality. Equality made a
          # downgrade look like an upgrade, so rolling back re-ran full setup
          # and re-randomised the operator's guest SSID (bench MT3000,
          # 2026-09-24). The suite pins absent/same/older/newer/malformed/
          # suffixed markers and the alpha4->alpha5->alpha4 round trip, and its
          # negative control fails if the comparison ever goes back to equality.
          bash tests/uci-defaults-setup-marker-order_test.sh

      - name: Admin TLS identity (HTTPS is not inherited from the image)
        run: |
          # Offline (no router, no SDK, no network): the install path must
          # PROVISION a TLS identity that covers this router and must derive
          # uhttpd.main.redirect_https from a COVERAGE check, not from a
          # readable-and-non-empty certificate file. The OpenWrt image ships a
          # placeholder (CN=OpenWrt, SAN DNS:OpenWrt) that satisfies the old
          # guard while covering neither the hostname nor the LAN IP, so :8080
          # redirected a browser into a hard certificate error (bench MT3000,
          # 2026-09-26). The suite drives the shipped uci-defaults script end to
          # end against a fixture, pins the operator opt-out that `tollgate ssl
          # remove` records, and carries a negative control that runs the
          # pre-change rule over the same fixture and must derive
          # redirect_https=1 from the placeholder.
          bash tests/uci-defaults-admin-tls-identity_test.sh
      - name: LuCI is not reachable pre-auth (guest path is the portal)
        run: |
          # Offline (no router, no daemon, no network): LuCI's :8080/:443 must
          # not be in nodogsplash's pre-auth allow list, and a list that carries
          # them must be repaired on every setup path. Measured on the bench
          # MT3000 (2026-09-25, pre17): a paying guest who typed
          # `http://<router>/` fell through to `https://<router>/` and got the
          # router's administration login, which the operator read as
          # "the install is broken".
          bash tests/uci-defaults-luci-ports-not-pre-auth_test.sh

      - name: A trusted client gets a plain-HTTP entry point on :80
        run: |
          # Offline (no router, no daemon, no network): nodogsplash DNATs :80 to
          # its splash port only for a PRE-AUTH client, so for a trusted or
          # authenticated one `http://<router>/` was dead (nothing listened) and
          # the client fell through to LuCI. The suite pins the uhttpd.trusted
          # :80 listener, its redirect stub to the portal SPA on :2051, and that
          # both setup paths re-assert it.
          bash tests/uci-defaults-trusted-entry-80_test.sh

      - name: The wired LAN ports move onto the operator's private bridge
        run: |
          # Offline (no router, no daemon, no network): the wired LAN ports
          # must be MOVED off the captive bridge onto br-private - the
          # operator's trusted network with internet, the admin board and
          # LuCI, no payment step - discovered from the bridge's device
          # section (never named per board), idempotently, with the captive
          # bridge's port list cleared so a port is never on two layer-2
          # domains. The same-version verify/repair path re-asserts the
          # placement (a factory reset is repaired), the module keep-list
          # still carries /etc/config/network, and all four guard fragments
          # are pinned byte-identical to main and still br-lan-scoped - that
          # literal is what keeps a guest off :8090/:8443 and LuCI while a
          # br-private client gets in. A neutralised-writer negative control
          # must go red.
          bash tests/uci-defaults-lan-private-wired_test.sh

      - name: One device code (hostname, captive SSID and private SSID agree)
        run: |
          # Offline (no router, no daemon, no network): the router's identity is
          # ONE code, minted once, stored in /etc/config/tollgate and reused —
          # never re-minted (bench MT3000, 2026-09-26: hostname=tollgate-OQ3Q
          # while the captive SSID had been re-minted to tollgate-0GLK and the
          # private SSID carried a suffix from a third mint path). The suite
          # pins the adoption order, the store's authority, the
          # <nym>-<code> private SSID with `tollgate network private rename` as
          # the honoured escape hatch, and that exactly ONE mint site ships.
          bash tests/uci-defaults-device-code_test.sh

      - name: The portal banner is one value on both paths, and committed
        run: |
          # Offline (no router, no daemon, no network): nodogsplash's
          # `gatewayname` is the string a captive client reads on the splash
          # page, and TWO writers in the shipped driver produce it — the full
          # setup and the verify/repair convergence a same-version reinstall
          # takes. The repair path used to converge on a second spelling (no
          # " Portal" suffix) and never committed it on a settled router (its
          # block runs before the export-diff snapshot the conditional commit
          # is taken against), so the write stayed a /tmp/.uci session delta and
          # a later `uci commit nodogsplash` re-applied it with the wrong banner
          # (PR #605 cold review, F1/F2). This suite drives BOTH paths against a
          # DELTA-AWARE uci (committed state + pending delta, as uci has under
          # /tmp/.uci) and pins one committed banner from each path, with no
          # gatewayname op left pending.
          bash tests/uci-defaults-gatewayname-banner_test.sh


      - name: Spec-quote drift check
        run: |
          # Pinned greatspectations ref (scheduled bump: update when releasing).
          GS_REF=0f226495657e5febebd270b6a07b8562cca003d3
          # Pinned cashubtc/nuts snapshot (scheduled bump: update when releasing).
          NUTS_REF=49a909ce4d0739824b3859d4b3da21e6c1abdaeb
          pip install --user --break-system-packages "git+https://github.com/rustyrussell/greatspectations.git@$GS_REF"
          export PATH="$PATH:$HOME/.local/bin"
          git init -q nuts
          git -C nuts remote add origin https://github.com/cashubtc/nuts.git
          git -C nuts fetch --depth=1 origin "$NUTS_REF"
          git -C nuts checkout --detach FETCH_HEAD
          FILES=$(find src -name "*.go" -not -name "*_test.go")
          # Spec drift FAILS the build: quotes verified against pinned nuts snapshot.
          greatspectate check --config specquotes.toml --comment-start "// " --comment-continue "//" $FILES

  build-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Build purity check
        run: bash tests/contract/build-purity.sh
      - name: Shipped AP SSID format check
        run: bash tests/contract/check-ssid-format.sh
      - name: NDS pre-auth allowlist nft ordering check
        run: bash tests/contract/check-nds-preauth-nft.sh
      - name: nft guard interface defines check
        run: bash tests/contract/check-nft-interface-defs.sh

  deps-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Dependency sync check
        run: python3 tests/contract/check-deps-sync.py
      - name: Mirror and relay sync check
        run: python3 tests/contract/check-mirror-sync.py
      - name: Stale import path check
        run: python3 tests/contract/check-import-paths.py

  packaging-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Packaging and uci-defaults shell suites (the full set)
        run: |
          # The release-check packaging leg, run per PR: 17 of these suites
          # were lane-absent, which is how #648's class (rebrand-gutter red)
          # and #663's class (committed conflict markers) reached main.
          fail=0
          for t in tests/packaging/*_test.sh tests/uci-defaults-*_test.sh; do
            echo "== $t"
            if ! bash "$t"; then
              echo "FAILED: $t" >&2
              fail=1
            fi
          done
          exit $fail

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No unresolved conflict markers in the tracked tree
        run: |
          # Would have caught the #663 residue (markers committed through a
          # rebase) before merge. Anchored to the marker-plus-space shape so
          # prose and base64 never trip it.
          if git grep -nE '^(<{7} |>{7} )' -- .; then
            echo "ERROR: unresolved conflict markers are committed" >&2
            exit 1
          fi
          echo "ok: no conflict markers"

  release-check-fast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Fast release-check on main (conformance + repro skipped)
        run: make release-check-fast VERSION="$(cat VERSION)"
