name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - src/config_manager
          - src/utils
          - src/cmd/tollgate-cli
          - src/lightning
          - src/merchant
          - src/tollgate_protocol
          - src/tollwallet
          - src/valve
          - src/wireless_gateway_manager
          # NOTE: src/cli, src/upstream_detector and
          # src/upstream_session_manager are intentionally omitted. They
          # transitively pull in the lnd -> ltcsuite/ltcd chain, which only
          # builds standalone after an invasive go.mod rewrite (an `exclude`
          # directive plus a full re-tidy). They still build/test as part of
          # the root module's build; adding them here is tracked separately.
          # src/merchant was added once its go.mod gained the ltcsuite/ltcd
          # `exclude` directive and a full re-tidy (PR #361).
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test-summary.sh" "${{ matrix.module }}" ./... -v -count=1 -race

  main-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Run main package tests
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test-summary.sh" "main package (testenv)" -v -count=1 -race -tags testenv .

  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Schema lint
        run: node tests/contract/js-schema-lint.mjs

      - name: Setup-marker ordering (roll-back safety)
        run: |
          # Offline (no router, no SDK, no network): the setup script's version
          # marker must be compared BY ORDER, not for equality. Equality made a
          # downgrade look like an upgrade, so rolling back re-ran full setup
          # and re-randomised the operator's guest SSID (bench MT3000,
          # 2026-09-24). The suite pins absent/same/older/newer/malformed/
          # suffixed markers and the alpha4->alpha5->alpha4 round trip, and its
          # negative control fails if the comparison ever goes back to equality.
          bash tests/uci-defaults-setup-marker-order_test.sh

      - name: LuCI is not reachable pre-auth (guest path is the portal)
        run: |
          # Offline (no router, no daemon, no network): LuCI's :8080/:443 must
          # not be in nodogsplash's pre-auth allow list, and a list that carries
          # them must be repaired on every setup path. Measured on the bench
          # MT3000 (2026-09-25, pre17): a paying guest who typed
          # `http://<router>/` fell through to `https://<router>/` and got the
          # router's administration login, which the operator read as
          # "the install is broken".
          bash tests/uci-defaults-luci-ports-not-pre-auth_test.sh

      - name: A trusted client gets a plain-HTTP entry point on :80
        run: |
          # Offline (no router, no daemon, no network): nodogsplash DNATs :80 to
          # its splash port only for a PRE-AUTH client, so for a trusted or
          # authenticated one `http://<router>/` was dead (nothing listened) and
          # the client fell through to LuCI. The suite pins the uhttpd.trusted
          # :80 listener, its redirect stub to the portal SPA on :2051, and that
          # both setup paths re-assert it.
          bash tests/uci-defaults-trusted-entry-80_test.sh

      - name: Spec-quote drift check
        run: |
          # Pinned greatspectations ref (scheduled bump: update when releasing).
          GS_REF=0f226495657e5febebd270b6a07b8562cca003d3
          # Pinned cashubtc/nuts snapshot (scheduled bump: update when releasing).
          NUTS_REF=49a909ce4d0739824b3859d4b3da21e6c1abdaeb
          pip install --user --break-system-packages "git+https://github.com/rustyrussell/greatspectations.git@$GS_REF"
          export PATH="$PATH:$HOME/.local/bin"
          git init -q nuts
          git -C nuts remote add origin https://github.com/cashubtc/nuts.git
          git -C nuts fetch --depth=1 origin "$NUTS_REF"
          git -C nuts checkout --detach FETCH_HEAD
          FILES=$(find src -name "*.go" -not -name "*_test.go")
          # Spec drift FAILS the build: quotes verified against pinned nuts snapshot.
          greatspectate check --config specquotes.toml --comment-start "// " --comment-continue "//" $FILES

  build-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Build purity check
        run: bash tests/contract/build-purity.sh

  deps-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Dependency sync check
        run: python3 tests/contract/check-deps-sync.py
      - name: Mirror and relay sync check
        run: python3 tests/contract/check-mirror-sync.py
      - name: Stale import path check
        run: python3 tests/contract/check-import-paths.py
