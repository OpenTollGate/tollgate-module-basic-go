# router-test — the TBMG Trust Pipeline entry point.
#
# Every pull request runs the isolated QEMU lab (Phase B) through the elected
# router-bench-gateway, and the result is posted back as a single, idempotent PR
# comment (the `report` job) so a reviewer sees at a glance whether the PR is
# ready to merge. Post-merge `main` runs additionally reach the physical bench
# (Phase C).
#
# Runs on the self-hosted runner registered by role 86-tbmg-runner (hermes-nvme):
# it reaches the gateway over the private fips mesh (ADR-018) with a DEDICATED
# per-machine key — no per-repo secrets, no metered LAN traffic, and the runner
# host carries the OpenWrt build toolchain (Phase A).
#
# SECURITY CONTRACT (mirrors physical-router-test-automation's hw-smoke):
#   * The physical bench is NEVER reachable from a pull_request: PR runs use the
#     isolated QEMU lab only (environment `router-lab`, no paid traffic).
#   * Post-merge `main` runs may touch the bench, behind the `bench-hardware`
#     environment (required reviewers). Paid-traffic specs are OFF by default.
#   * A self-hosted runner must never execute untrusted (fork) PR code: the
#     router-test job is restricted to same-repo refs. Fork PRs get a visible
#     "not tested" comment instead of a silent skip.
#   * Bench work lives in THIS file only.
name: router-test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target:
        description: auto|lab|physical|both
        type: choice
        options: [auto, lab, physical, both]
        default: auto
      lane:
        description: readonly|mutating
        type: choice
        options: [readonly, mutating]
        default: readonly
      paid:
        description: "Enable paid-traffic specs (mutating only)"
        type: boolean
        default: false

concurrency:
  # Serialise per ref; drop superseded PR pushes (never cancel a main proof run).
  group: router-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.head.outputs.proceed }}
      untrusted: ${{ steps.head.outputs.untrusted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Head-check (drop superseded commits) + fork-trust check
        id: head
        # Values reach the shell through the environment, never through `${{ ... }}`
        # interpolation: a branch name is contributor-controlled on a fork PR, and
        # interpolating it would splice it into the script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          THIS_SHA: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          untrusted=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${HEAD_REPO:-}" != "${BASE_REPO:-}" ]; then
            untrusted=true
          fi
          echo "untrusted=$untrusted" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            head=$(git ls-remote origin "refs/heads/$REF_NAME" | awk '{print $1}')
            if [ -n "$head" ] && [ "$head" != "$THIS_SHA" ]; then
              echo "superseded by ${head} — skipping ${THIS_SHA}"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  router-test:
    needs: plan
    # Fork PRs never run on the self-hosted runner (untrusted code); they are
    # reported as "not tested" by the report job below.
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.untrusted == 'false'
    runs-on: [self-hosted, tbmg]
    timeout-minutes: 60
    # PR -> isolated lab; a lab dispatch stays on the lab; only a push to main
    # (or a dispatch that asks for the physical bench) needs `bench-hardware`
    # (required reviewers). Spelled out because GitHub's `a && b || c` idiom
    # would send a LAB dispatch to the bench approvers.
    steps:
      - name: Run via the elected router-bench-gateway (over fips)
        env:
          EVENT: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target || 'auto' }}
          LANE: ${{ inputs.lane || 'readonly' }}
          PAID: ${{ inputs.paid || 'false' }}
          GW_HOST: cobrador
        run: |
          set -eu
          # role 86-tbmg-runner installs the dedicated `cobrador` SSH alias
          # (id_tbmg_gateway) over the fips mesh — no per-repo secret required.
          # The PR head's ref is passed through the environment, never interpolated.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$GW_HOST" \
            "~/.hermes/scripts/router_bench_test.sh --event $EVENT --ref '$REF' \
               --commit '$SHA' --target '$TARGET' --lane '$LANE' --paid '$PAID'"

  bench:
    needs: plan
    # The bench lanes flash clean images and run the suite on the physical
    # routers. That is bench-hardware work (required reviewers) and never a
    # pull_request concern — PRs use the isolated lab only.
    if: github.event_name != 'pull_request' && needs.plan.outputs.proceed == 'true'
    runs-on: [self-hosted, tbmg]
    timeout-minutes: 180
    steps:
      - name: Run the bench lanes via the router-bench-gateway (over fips)
        env:
          GW_HOST: cobrador
        run: |
          set -eu
          # bench-lanes.sh runs every configured lane on the gateway — clean
          # flash -> install -> smoke -> radios OFF (guaranteed) — and emits a
          # JSON summary; it exits non-zero if any lane failed.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$GW_HOST" \
            'cd ~/physical-router-test-automation && scripts/bench/bench-lanes.sh' \
            | tee bench-lanes.json

  report:
    needs: [plan, router-test, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise (ngit-ci publishes the signed result to Nostr)
        run: |
          echo "ngit-ci publishes Job/Workflow Results (kinds 9841/9842) to Nostr;"
          echo "view them at https://ci.orangesync.tech or via scripts/operator/ngit-ci-status.py"
          echo "plan=${{ needs.plan.result }} router-test=${{ needs.router-test.result }} bench=${{ needs.bench.result }}"
