name: Announce Release (stage 2, after every shard)

# ============================================================================
# The LAST file of the ngit release pipeline, and the only one that publishes
# kind-1063 announcements.
#
# WHY THIS IS A SEPARATE FILE
#   Before the shards, each package job announced its own artifact the moment it
#   uploaded it, so a run cut off at the 1800 s ceiling left a release that
#   LOOKED finished while most of the matrix had never run (measured
#   2026-09-12, commit b25d8a28: 5 of 17 legs announced, workflow result
#   `timed_out`). Announcements are now published here and nowhere else, and
#   only after every shard of the same (version, channel, release run) has
#   reported success AND every leg in the plan has a build record naming that
#   same release run.
#
#   The rule, the staleness argument and the exit codes are in
#   scripts/ngit-release-announce.sh. This file is the CI front end for it.
#
# HOW IT STARTS
#   Manual replay only, at
#       refs/heads/release/<version>/<channel>/<release_run>/announce
#   which is where the version, the channel and the release run come from. The
#   normal path is scripts/ngit-ci-release.sh, which triggers every shard in
#   order, waits for each kind-9842 result, stops the chain on the first
#   non-success, and only then starts this file. Triggering it by hand is
#   supported and is the point: the gate is re-evaluated from the relays, so a
#   hand-run against an incomplete release refuses (exit 1) rather than
#   announcing.
#
#   A push to main does NOT start this file -- `workflow_dispatch` only.
# ============================================================================

on:
  workflow_dispatch:

env:
  PACKAGE_NAME: "tollgate-wrt"
  COORDINATION_RELAYS: >-
    wss://relay.damus.io
    wss://nos.lol
    wss://nostr.mom
    wss://relay1.orangesync.tech
    wss://relay2.orangesync.tech
  RELAYS: "wss://relay.damus.io wss://nos.lol wss://nostr.mom wss://relay1.orangesync.tech wss://relay2.orangesync.tech"

jobs:
  # --------------------------------------------------------------------------
  # Read-only. Decides whether this release may be announced at all. It is the
  # job that must FAIL when a shard failed or timed out, so it runs the same
  # gate the announce job runs, with --dry-run.
  # --------------------------------------------------------------------------
  release-guard:
    name: Release completeness gate (no announcements yet)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    outputs:
      package_version: ${{ steps.identity.outputs.package_version }}
      release_channel: ${{ steps.identity.outputs.release_channel }}
      release_run: ${{ steps.identity.outputs.release_run }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      # The ref IS the parameter: ngit-ci never delivers workflow_dispatch
      # inputs, so the version, the channel and the release run have to travel
      # in the ref. A ref this file cannot read is refused rather than guessed
      # -- announcing under a guessed (version, channel) is exactly the failure
      # the gate exists to prevent.
      - name: Resolve the release identity from the ref
        id: identity
        run: |
          set -euo pipefail
          : ${GITHUB_OUTPUT:=/tmp/github_output}
          echo "build_id=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "$REF_NAME" =~ ^release/([^/]+)/([^/]+)/([^/]+)/announce$ ]]; then
            echo "ERROR: this file announces a release and must be replayed at" >&2
            echo "       refs/heads/release/<version>/<channel>/<release_run>/announce" >&2
            echo "       got: '${REF_NAME:-<unset>}' (GITHUB_REF=${GITHUB_REF:-<unset>})" >&2
            echo "       refusing to guess which release to announce." >&2
            exit 1
          fi
          echo "package_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "release_run=${BASH_REMATCH[3]}"     >> "$GITHUB_OUTPUT"
          echo "announcing version=${BASH_REMATCH[1]} channel=${BASH_REMATCH[2]} release_run=${BASH_REMATCH[3]}"

      - name: Gate (dry run — nothing is published here)
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.release_channel }}
          RELEASE_RUN: ${{ steps.identity.outputs.release_run }}
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: |
          set -euo pipefail
          bash scripts/ngit-release-announce.sh \
            "$PACKAGE_VERSION" "$RELEASE_CHANNEL" "$RELEASE_RUN" "$BUILD_ID" --dry-run

  # --------------------------------------------------------------------------
  # THE BEHAVIORAL GATE. The happy path is exercised on the exact bytes this
  # release is about to announce -- the x86_64 .apk the apk-x86-64 shard
  # built, fetched from that leg's own kind-30078 build record -- and the
  # release does not proceed if it is broken: `announce` needs this job, with
  # no `if: always()`, so a red suite skips the announcement fail-closed.
  # Port of the dead GitHub lane's happy-path job (build-package.yml), which
  # shipped the rule but ran nowhere after 2026-08-27.
  #
  # Why: the happy path broke three times in ways only manual testing caught
  # (stale vendored portal bundle, renewal-after-expiry dead end, a Lightning
  # lane that could not buy time). The suite that catches them
  # (tests/happy-path/, #544) is offline -- no secret, no token, no real
  # mint -- so it is safe to run unattended.
  #
  # ngit notes: actions/download-artifact does not work here (no runtime
  # token), so the package travels the ngit-native way -- the leg's build
  # record on the coordination relays names the Blossom mirrors and the
  # sha256, and this job verifies the bytes it downloaded against that
  # record before extracting. `container:` is refused on this runner, but
  # `docker run` works (alpine + apk-tools-static extraction, the recipe in
  # tests/happy-path/README.md).
  # --------------------------------------------------------------------------
  happy-path:
    name: Happy path (suite on the built x86_64 .apk, --strict)
    needs: [release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Fetch the x86_64 .apk this release built (from its build record)
        env:
          BUILD_ID: ${{ needs.release-guard.outputs.build_id }}
          RELEASE_RUN: ${{ needs.release-guard.outputs.release_run }}
        run: |
          set -euo pipefail
          RECORD="$(timeout 60 nak req -k 30078 \
              --tag "d=tollgate-build/${BUILD_ID}/x86_64/apk/none" \
              --limit 1 $COORDINATION_RELAYS | head -n 1)"
          [ -n "$RECORD" ] || { echo "FAIL: no build record for ${BUILD_ID}/x86_64/apk/none -- nothing to gate on"; exit 1; }
          CONTENT="$(printf '%s' "$RECORD" | jq -r '.content' | jq -c .)"
          # The record must name THIS release run: a leftover record from an
          # earlier release at the same commit is not evidence (same rule the
          # announce gate enforces on every leg).
          GOT_RUN="$(printf '%s' "$CONTENT" | jq -r '.release_run')"
          [ "$GOT_RUN" = "$RELEASE_RUN" ] || { echo "FAIL: record release_run=${GOT_RUN}, this run is ${RELEASE_RUN}"; exit 1; }
          SHA="$(printf '%s' "$CONTENT" | jq -r '.sha256')"
          [ -n "$SHA" ] && [ "$SHA" != "null" ] || { echo "FAIL: record carries no sha256: $CONTENT"; exit 1; }
          mkdir -p /var/tmp/hp-artifact/extracted
          got=""
          for u in $(printf '%s' "$CONTENT" | jq -r '.urls[]'); do
            echo "trying mirror: $u"
            if curl -fsSL --retry 2 -o /var/tmp/hp-artifact/tollgate-wrt.apk "$u"; then got="$u"; break; fi
          done
          [ -n "$got" ] || { echo "FAIL: no mirror answered for ${SHA:0:16}…"; exit 1; }
          ACTUAL="$(sha256sum /var/tmp/hp-artifact/tollgate-wrt.apk | awk '{print $1}')"
          [ "$ACTUAL" = "$SHA" ] || { echo "FAIL: downloaded bytes sha256 ${ACTUAL:0:16}… != record ${SHA:0:16}…"; exit 1; }
          echo "OK: fetched $SHA from $got"

          # An OpenWrt .apk is a custom v3 format (NOT gzip/zstd): extract
          # with apk-tools. `apk.static extract --destination` does NOT create
          # the destination dir (measured on the GitHub lane's first run), so
          # it is created on the host first. The extracted tree is exactly
          # what the module sees on a router. `--network host` matches the
          # dep-smoke suite's own workaround: on runners whose docker bridge
          # DNS flakes against the Alpine CDN (measured on ai-legion), the
          # apk-tools-static fetch only resolves on host networking.
          docker run --rm --network host -v /var/tmp/hp-artifact:/out alpine:edge sh -c \
            'apk add --no-cache apk-tools-static >/dev/null &&
             /sbin/apk.static extract --allow-untrusted --destination /out/extracted /out/tollgate-wrt.apk'
          ls -l /var/tmp/hp-artifact/extracted/usr/bin/

      - name: Install the suite's runner-side dependencies
        run: |
          set -euo pipefail
          # The artifact binary is musl x86_64: the suite runs it natively via
          # /lib/ld-musl-x86_64.so.1 (`musl` pkg) and pulls libgcc_s.so.1 out
          # of alpine:3.20. Playwright drives the portal half in a browser.
          sudo apt-get update -qq
          sudo apt-get install -y musl
          docker pull alpine:3.20
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium

      # Dependency-resolution smoke (seconds, not minutes): apk3 must be able
      # to select every declared name from the standard 25.12.x feed set -- the
      # September #552 breakage class, caught before "a bench VM cannot
      # install it" is the messenger.
      - name: Apk dependency-resolution smoke
        run: |
          set -euo pipefail
          export APK=/var/tmp/hp-artifact/tollgate-wrt.apk
          bash tests/packaging/apk-install-resolution_test.sh

      # --strict: this artifact is built from the tip, which carries
      # /session-state and the renewal CTA, so an absent expected surface must
      # FAIL, not SKIP. The gate script tolerates ONLY the check ids in
      # tests/happy-path/known-issues.txt.
      - name: Run the happy-path suite
        env:
          HP_PYTHON: python3
        run: |
          set -euo pipefail
          bash .github/scripts/happy-path-gate.sh \
            --artifact /var/tmp/hp-artifact/extracted \
            --out "$RUNNER_TEMP/happy-path-evidence"

      - name: Suite verdict summary (kept last -- only the log tail survives in the job record)
        if: always()
        run: |
          echo "=== happy-path gate: see steps above for the full evidence ==="
          ls -la "$RUNNER_TEMP/happy-path-evidence" 2>/dev/null || echo "(no evidence dir -- gate did not reach the suite)"

  # --------------------------------------------------------------------------
  # Publishes one kind-1063 per leg, from the leg's own build record. The gate
  # runs again inside the script: this job cannot publish without a complete
  # release even if it is reached on its own.
  #
  # `happy-path` is in the needs list on purpose and there is deliberately no
  # `if: always()`: a red happy path skips the announcement, fail-closed,
  # instead of publishing a broken build to every feed consumer.
  # --------------------------------------------------------------------------
  announce:
    needs: [release-guard, happy-path]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Publish the kind-1063 announcements
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
          PACKAGE_VERSION: ${{ needs.release-guard.outputs.package_version }}
          RELEASE_CHANNEL: ${{ needs.release-guard.outputs.release_channel }}
          RELEASE_RUN: ${{ needs.release-guard.outputs.release_run }}
          BUILD_ID: ${{ needs.release-guard.outputs.build_id }}
        run: |
          set -euo pipefail
          bash scripts/ngit-release-announce.sh \
            "$PACKAGE_VERSION" "$RELEASE_CHANNEL" "$RELEASE_RUN" "$BUILD_ID" --publish

  # --------------------------------------------------------------------------
  # The publication gate, on its own budget: every (arch, format) the plan
  # declares must now have an announcement on the channel relays and be
  # fetchable from >= 2 Blossom mirrors with the sha256 carried in its `x` tag.
  # Expectations come from the shard plan, never from the relays.
  # --------------------------------------------------------------------------
  verify-publication:
    name: Verify channel publication (events + mirrors)
    needs: [release-guard, announce]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Verify every (arch, format) in the plan is announced and mirrored
        env:
          PACKAGE_VERSION: ${{ needs.release-guard.outputs.package_version }}
          RELEASE_CHANNEL: ${{ needs.release-guard.outputs.release_channel }}
          # Every pair, not a sample: the whole set costs one download per pair
          # per mirror, and a sampled pass is what let mirror rot ship before.
          VERIFY_DOWNLOAD: all
        run: |
          set -euo pipefail
          EXPECTATIONS=$(bash scripts/ngit-shards.sh expectations --compression all --formats ipk,apk)
          echo "$EXPECTATIONS"
          export VERIFY_EXPECT="$EXPECTATIONS"
          bash scripts/verify_publication.sh "$PACKAGE_VERSION" "$RELEASE_CHANNEL" -

  # --------------------------------------------------------------------------
  # The tollgate-os hand-off. `if: always()` so a red sibling upstream does not
  # suppress it, and continue-on-error because it is a record plus a printed
  # manual step, never a dispatch (the GitHub twin's cross-repo token does not
  # exist here).
  # --------------------------------------------------------------------------
  os-handoff:
    needs: [release-guard, announce]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak

      - name: Publish the tollgate-os handoff record
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
          PACKAGE_VERSION: ${{ needs.release-guard.outputs.package_version }}
          BUILD_ID: ${{ needs.release-guard.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "not a main-branch run (ref=${GITHUB_REF:-unset}) -- skipping the tollgate-os handoff"
            echo "a release run announces version $PACKAGE_VERSION; the handoff is published by"
            echo "the main-branch stage-2 run of the same commit."
            exit 0
          fi
          CONTENT=$(jq -cn --arg v "$PACKAGE_VERSION" --arg b "$BUILD_ID" \
            '{override_tollgate_wrt_version:$v, build_id:$b, repo:"tollgate-module-basic-go"}')
          nak event --sec "$NSEC_HEX" -k 30078 \
            --tag "d=tollgate-build-os-handoff/${BUILD_ID}" \
            --tag "r=${BUILD_ID}" \
            --tag "t=tollgate-build-os-handoff" \
            -c "$CONTENT" $COORDINATION_RELAYS $RELAYS < /dev/null || true
          echo "---------------------------------------------------------------"
          echo "tollgate-os handoff: override_tollgate_wrt_version=$PACKAGE_VERSION"
          echo "There is no GitHub Actions in OpenTollGate/tollgate-os (disabled"
          echo "org-wide) and no cross-repo token, so the record above is the"
          echo "machine-readable trigger and the build-os workflow must be started"
          echo "by hand with the version above."
          echo "---------------------------------------------------------------"
