name: Test gates

# The gate-shaped legs of the old single test lane, split out in #520: at
# 16 jobs that lane was by far the heaviest push invocation on a runner
# capped at NGIT_CI_MAX_CONCURRENT_JOBS=2 and a 1800 s act ceiling
# (.ngit/README.md), and it was the one the coordinator dropped entirely or
# concluded failure on with every published job green. Every check here ran
# in .ngit/act/workflows/test.yml before the split, on the same triggers;
# nothing was dropped, only re-filed.
#
# Two of the three jobs were also unobservable in the old shape, which is
# part of the #520 evidence (14 of 16 declared jobs ever published a kind
# 9841):
#
#   - release-check-fast carried a job-level `if: github.ref == …`, and a
#     job skipped by an if: never publishes a job result -- on a
#     coordinator whose synthesized push payloads are documented to mangle
#     fields, the guard cannot be trusted to fire on main either. The port
#     convention (.ngit/README.md, port table) is ref-dependent logic INSIDE
#     the step as bash; this file restores it.
#   - hygiene used `git grep`, but act checkouts carry no git metadata
#     (.ngit/README.md, "No git metadata in the checkout"): git grep exits
#     2 there and the old if/then shape read that as "no markers found" --
#     vacuously green on the runner this lane actually executes on.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  packaging-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Packaging and uci-defaults shell suites (the full set)
        run: |
          # The release-check packaging leg, run per PR: 17 of these suites
          # were lane-absent, which is how #648's class (rebrand-gutter red)
          # and #663's class (committed conflict markers) reached main.
          fail=0
          for t in tests/packaging/*_test.sh tests/uci-defaults-*_test.sh; do
            echo "== $t"
            if ! bash "$t"; then
              echo "FAILED: $t" >&2
              fail=1
            fi
          done
          exit $fail

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No unresolved conflict markers in the tracked tree
        run: |
          # Would have caught the #663 residue (markers committed through a
          # rebase) before merge. Anchored to the marker-plus-space shape so
          # prose and base64 never trip it.
          #
          # grep -r, NOT git grep: act checkouts carry no git metadata
          # (.ngit/README.md), where git grep exits 2 and the old if/then
          # shape read that as a pass. Exit codes are handled explicitly so
          # a scan that cannot run fails the job instead of passing silently.
          set -euo pipefail
          status=0
          grep -rEn --exclude-dir=.git '^(<{7} |>{7} )' . || status=$?
          case $status in
            0) echo "ERROR: unresolved conflict markers are committed" >&2; exit 1 ;;
            1) echo "ok: no conflict markers" ;;
            *) echo "ERROR: the marker scan itself failed (rc=$status)" >&2; exit 1 ;;
          esac

  release-check-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
      - name: Fast release-check on main (conformance + repro skipped)
        run: |
          # The main-only gate is bash INSIDE the step, not a job-level if:,
          # per the port convention: a job skipped by an if: never publishes
          # a job result, so the lane's published-job count fell short of its
          # declared count (#520), and the coordinator's synthesized push
          # payloads cannot be trusted to carry github.ref faithfully anyway.
          # A job that always starts and self-skips with a visible line keeps
          # the two counts equal, on every ref.
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "skip: release-check-fast is main-only (GITHUB_REF='${GITHUB_REF:-}')"
            exit 0
          fi
          make release-check-fast VERSION="$(cat VERSION)"
