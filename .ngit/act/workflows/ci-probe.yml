name: ngit-ci environment probe

# Temporary diagnostic workflow for the release-pipeline port. Everything it
# learns is printed by the LAST step of each job, because only the tail of a
# job log is retained in the kind-9841 content.
#
# Questions it answers:
#   * cpu/memory ceiling of a real ngit-ci job container, and the checkout depth
#     (the release version string uses `git rev-list --count HEAD`)
#   * whether the coordinator's opt-in container daemon socket is usable, so the
#     ported SDK jobs can `docker run` instead of declaring a (refused)
#     `container:` block
#   * whether `actions/upload-artifact` + `download-artifact` work in this
#     deployment (the port needs them for the captive-portal assets)
#   * whether the release-signing secret NSEC_HEX reaches a maintainer-authored
#     push run (length only - the value is never printed)
#   * outbound reachability to the Blossom mirrors
#
# Deleted once build-package.yml and build-package-apk.yml are verified.

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Collect facts
        env:
          NSEC_HEX_PROBE: ${{ secrets.NSEC_HEX }}
        run: |
          {
            echo "== identity =="; id
            echo "== cpu =="; nproc
            echo "== memory (MB) =="; free -m | head -2
            echo "== cgroup memory.max =="; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo none
            echo "== cgroup cpu.max =="; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo none
            echo "== disk =="; df -h / /tmp 2>/dev/null | tail -2
            echo "== checkout =="
            echo "  shallow=$(git rev-parse --is-shallow-repository 2>/dev/null)"
            echo "  head=$(git rev-parse HEAD)"
            echo "  rev-list-count=$(git rev-list --count HEAD 2>/dev/null || echo FAILED)"
            echo "== runtime env =="
            for v in GITHUB_REF GITHUB_REF_NAME GITHUB_SHA GITHUB_EVENT_NAME \
                     GITHUB_WORKSPACE RUNNER_OS RUNNER_ARCH NGIT_CI_REPOSITORY \
                     NGIT_CI_TRIGGER_EVENT DOCKER_HOST HOME; do
              printf '  %s=%s\n' "$v" "$(eval "printf '%s' \"\${$v:-<unset>}\"")"
            done
            echo "== tools =="
            for t in go node npm python3 pip3 jq curl ar tar upx upx-ucl nak docker apt-get sudo make; do
              printf '  %-9s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
            done
            echo "== daemon socket =="
            if [ -S /var/run/docker.sock ]; then
              echo "  /var/run/docker.sock present: $(ls -l /var/run/docker.sock)"
              docker version 2>&1 | grep -E 'Server|Client|Version' | head -6 || true
            else
              echo "  /var/run/docker.sock NOT mounted"
            fi
            echo "== docker run smoke test =="
            docker run --rm --user root alpine:3.20 sh -c 'echo docker-run-ok; id -u' 2>&1 | tail -3
            echo "== release signing secret =="
            echo "  NSEC_HEX length=${#NSEC_HEX_PROBE} (64 = released, 0 = withheld)"
          } > /tmp/facts.txt 2>&1
          true

      - name: Report facts (tail-retained)
        run: cat /tmp/facts.txt

  artifact-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Make a file
        run: |
          mkdir -p out
          printf 'portal-assets-probe-%s\n' "$GITHUB_SHA" > out/marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: portal-assets
          path: out/
          retention-days: 1

  artifact-consumer:
    needs: [artifact-producer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-assets
          path: downloaded/
      - name: Report artifact handoff (tail-retained)
        run: |
          {
            echo "== upload/download-artifact handoff =="
            if [ -f downloaded/marker.txt ]; then
              echo "  WORKING: $(cat downloaded/marker.txt)"
            else
              echo "  BROKEN: downloaded/marker.txt missing"
              find . -maxdepth 3 | head -20
            fi
          } 2>&1 | tee -a /dev/stderr

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Blossom mirrors and GitHub
        run: |
          {
            echo "== outbound =="
            for u in https://github.com https://relay.ngit.dev \
                     https://blossom.primal.net https://blossom.psbt.me \
                     https://blossom1.orangesync.tech https://blossom2.orangesync.tech \
                     https://drive.cashu.email \
                     https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64; do
              printf '  %-52s ' "$u"
              curl -sS -o /dev/null -m 25 -w '%{http_code}\n' "$u" 2>&1 || true
            done
          } 2>&1
