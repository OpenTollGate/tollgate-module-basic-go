name: ngit-ci environment probe

# Temporary diagnostic workflow for the release-pipeline port. Only the TAIL of
# a job log survives in the kind-9841 content, so each job prints its findings
# last.
#
# Verified so far (2026-09-12, this deployment, coordinator 765cd47b on DQ05):
#   * `docker` CLI present at /usr/bin/docker, /var/run/docker.sock mounted
#     (root:2375) and `docker run --rm --user root alpine:3.20` works inside a
#     job -> the SDK jobs can use `docker run` instead of a refused
#     `container:` block
#   * `actions/upload-artifact@v4` FAILS with "Unable to get the
#     ACTIONS_RUNTIME_TOKEN env variable" -> the port must not pass bytes
#     between jobs with artifacts; it uses Blossom, like build-package.yml
#     already does for the compiled binaries
#   * NSEC_HEX is released to a maintainer-authored push run once the operator
#     passes NGIT_CI_SECRET_<ALIAS>__NSEC_HEX through the compose
#     `environment:` block (length=64 here)
#   * https://blossom1.orangesync.tech is unreachable from the runner;
#     primal.net, psbt.me, drive.cashu.email and blossom2 answer
#   * tools preinstalled: node/npm, python3/pip3, jq, curl, ar, tar, docker,
#     make, apt-get, sudo. NOT preinstalled: nak, upx/upx-ucl.
#
# This revision validates the exact primitives the ported release jobs need:
# install nak, upload to Blossom with the release key, fetch the blob back, and
# publish + read back a kind-30078 coordination event.

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

env:
  BLOSSOM_SERVERS: >-
    https://blossom.primal.net
    https://blossom.psbt.me
    https://drive.cashu.email
  COORDINATION_RELAYS: "wss://relay.damus.io wss://nos.lol"

jobs:
  blossom-and-nostr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install nak
        run: |
          curl -fsSL "https://github.com/fiatjaf/nak/releases/download/v0.16.2/nak-v0.16.2-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Blossom upload/download and kind-30078 round trip
        env:
          NSEC_HEX: ${{ secrets.NSEC_HEX }}
        run: |
          set -uo pipefail
          {
            echo "== release key =="
            echo "  NSEC_HEX length=${#NSEC_HEX}"

            if [ "${#NSEC_HEX}" -ne 64 ]; then
              echo "  ABORT: release signing secret not released to this run"
              exit 0
            fi

            echo "== upload test file to Blossom =="
            printf 'tollgate ngit-ci probe %s\n' "$GITHUB_SHA" > /tmp/probe.txt
            OK=0
            HASH=""
            for server in $BLOSSOM_SERVERS; do
              resp=$(nak blossom upload --server "$server" --sec "$NSEC_HEX" /tmp/probe.txt < /dev/null 2>&1) || true
              h=$(printf '%s' "$resp" | jq -r '.sha256 // empty' 2>/dev/null || echo "")
              if [ -n "$h" ] && [ "$h" != "null" ]; then
                OK=$((OK + 1)); [ -z "$HASH" ] && HASH="$h"
                echo "  ok: $server -> $h"
              else
                echo "  FAIL: $server -> $(printf '%s' "$resp" | tail -1)"
              fi
            done
            echo "  mirrors ok: $OK"
            echo "  sha256: ${HASH:-<none>}"
            echo "  (the file's own sha256: $(sha256sum /tmp/probe.txt | cut -d' ' -f1))"

            echo "== fetch the blob back from the first working mirror =="
            if [ -n "$HASH" ]; then
              for server in $BLOSSOM_SERVERS; do
                code=$(curl -sS -o /tmp/back.txt -w '%{http_code}' -m 30 "$server/$HASH" 2>/dev/null || echo 000)
                if [ "$code" = "200" ]; then
                  echo "  GET $server/$HASH -> 200 ($(wc -c < /tmp/back.txt) bytes)"
                  head -1 /tmp/back.txt | sed 's/^/    /'
                  break
                fi
                echo "  GET $server/$HASH -> $code"
              done
            fi

            echo "== publish kind 30078 with the release key =="
            BUILD_ID="${GITHUB_SHA:0:8}"
            COORD=$(jq -cn --arg sha256 "$HASH" --arg filename "probe.txt" \
              --argjson urls "[]" --arg arch "x86_64" --arg fmt "ipk" --arg compression "none" \
              '{sha256:$sha256, filename:$filename, urls:$urls, architecture:$arch, format:$fmt, compression:$compression}')
            out=$(nak event --sec "$NSEC_HEX" -k 30078 \
              --tag "d=tollgate-build/${BUILD_ID}/x86_64/ipk/none" \
              --tag "r=${BUILD_ID}" --tag "t=tollgate-build" \
              -c "$COORD" $COORDINATION_RELAYS < /dev/null 2>&1) || true
            EV_ID=$(printf '%s' "$out" | grep -o '"id":"[0-9a-f]\{64\}"' | head -1 | cut -d'"' -f4)
            echo "  published event id: ${EV_ID:-<none>}"
            echo "  relay output: $(printf '%s' "$out" | tr '\n' ' ' | tail -c 400)"

            echo "== read it back =="
            if [ -n "$EV_ID" ]; then
              got=$(timeout 40 nak req -k 30078 --tag "r=$BUILD_ID" $COORDINATION_RELAYS < /dev/null 2>/dev/null | grep -c "$EV_ID" || true)
              echo "  found $got matching event(s) on the coordination relays"
            fi

            echo "== runner facts (printed last so the tail keeps them) =="
            echo "  nproc=$(nproc)"
            echo "  mem=$(free -m | awk '/^Mem:/{print $2" MB total, "$7" MB available"}')"
            echo "  cgroup-mem-max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo none)"
            echo "  cgroup-cpu-max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo none)"
            echo "  shallow=$(git rev-parse --is-shallow-repository)"
            echo "  rev-list-count=$(git rev-list --count HEAD 2>/dev/null || echo FAILED)"
            echo "  go=$(go version 2>/dev/null || echo MISSING)"
            echo "  GITHUB_REF=$GITHUB_REF GITHUB_REF_NAME=$GITHUB_REF_NAME"
          } 2>&1 | tail -80
